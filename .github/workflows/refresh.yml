name: BullsFX content refresh

on:
  schedule:
    # Ogni ora (UTC). GitHub puo' ritardare/saltare qualche run sotto carico.
    - cron: "0 * * * *"
    # Ridondanza nella fascia pre-mattina CEST (03-06 UTC = 05-08 Milano):
    # se GitHub salta un run orario, questi :30 garantiscono il feed pieno alle 7.
    - cron: "30 3 * * *"
    - cron: "30 4 * * *"
    - cron: "30 5 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:   # permette di lanciarlo a mano dal tab "Actions"

permissions:
  contents: write      # per ricommittare index.html aggiornato

concurrency:
  group: bullsfx-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: claude-sonnet-5   # per spendere meno: claude-haiku-4-5-20251001
      ITEMS_PER_RUN: "8"                 # item generati per run
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate content
        run: python generate.py

      - name: Commit updated dashboard
        run: |
          git config user.name  "bullsfx-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain index.html)" ]; then
            git add index.html
            git commit -m "content refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "Nessuna modifica da pubblicare."
          fi
