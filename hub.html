<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulls Content Hub</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#121722; --panel2:#0f141d; --line:#1e2634;
    --txt:#e8ecf4; --mut:#8b95ab; --gold:#e6b64c; --green:#3ecf8e; --red:#ff6b6b;
    --t-alberto:#3ecf8e; --t-marco:#5aa9ff; --t-jj:#e6b64c; --t-claudia:#b48cff; --t-samantha:#ff6b6b; --t-nabil:#22d3ee; --t-luca:#ff7a1a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:inherit}
  .wrap{max-width:1200px;margin:0 auto;padding:18px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .brand{font-weight:800;font-size:20px;letter-spacing:.3px}
  .brand span{color:var(--accent,var(--gold))}
  .whoami{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--accent,var(--gold))}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 18px}
  .tab{min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--mut);cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center}
  .tab:focus-visible,.intel-sel .chip:focus-visible,.plan-phase>summary:focus-visible{outline:2px solid var(--accent,var(--gold));outline-offset:2px}
  .tab.on{background:var(--accent,var(--gold));color:#0b0e14;border-color:transparent}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .muted{color:var(--mut);font-size:13px}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px}
  .btn.primary{background:var(--accent,var(--gold));color:#0b0e14;border-color:transparent}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  /* Card verticale stile reel 9:16 */
  .card{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;min-height:420px;border-top:3px solid var(--accent,var(--gold))}
  .card .meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
  .card .angolo{color:var(--accent,var(--gold));font-weight:700}
  .card .hook{font-size:18px;font-weight:800;line-height:1.3;margin:2px 0 10px}
  .card .body{font-size:13.5px;color:#d3d9e6;flex:1;white-space:pre-wrap}
  .card .cta{margin-top:10px;font-weight:700;font-size:13.5px;color:var(--accent,var(--gold))}
  .card .fonte{margin-top:8px;font-size:11px;color:var(--mut)}
  .card .amb{margin-top:6px;font-size:11px;color:var(--mut);font-style:italic}
  .card .tick{position:absolute;top:12px;right:12px}
  .check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--mut);user-select:none}
  .check input{width:20px;height:20px;accent-color:var(--green);cursor:pointer}
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;background:#1a2130;color:var(--mut)}
  .badge.clean{color:var(--green)}
  .badge.orig{color:var(--gold)}
  /* Metriche */
  .mcard{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;border-left:3px solid var(--accent,var(--gold))}
  .mcard .mtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .mcard .mtitle{font-weight:800}
  .mcard .msub{color:var(--mut);font-size:12px}
  .block{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
  .block.locked{opacity:.55}
  .block h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
  .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .field label{display:block;font-size:11px;color:var(--mut);margin-bottom:4px}
  .field input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:7px}
  .idx{font-weight:800;color:var(--accent,var(--gold))}
  .pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;background:#1a2130;color:var(--mut)}
  .pill.ig{color:#ff6b6b}.pill.tt{color:#5aa9ff}
  /* Login */
  .overlay{position:fixed;inset:0;background:rgba(6,9,14,.92);display:flex;align-items:center;justify-content:center;z-index:50}
  .login{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:min(92vw,380px)}
  .login h2{margin:0 0 6px}
  .login .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .login input{width:100%;padding:12px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;font-size:16px;letter-spacing:2px;text-align:center}
  .login .err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
  /* Platform picker */
  .pick{position:fixed;inset:0;background:rgba(6,9,14,.9);display:none;align-items:center;justify-content:center;z-index:60}
  .pick .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(92vw,340px);text-align:center}
  .pick h3{margin:0 0 6px}.pick .psub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .pick .prow{display:flex;flex-direction:column;gap:8px}
  .empty{color:var(--mut);text-align:center;padding:40px;border:1px dashed var(--line);border-radius:14px}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:#0b0e14;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .note{font-size:12px;color:var(--mut);margin-top:6px}
  /* Analisi */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-left:3px solid var(--accent,var(--gold))}
  .stat .lbl{font-size:12px;color:var(--mut);margin-bottom:6px}
  .stat .val{font-size:24px;font-weight:800}
  .stat .sub{font-size:11px;color:var(--mut);margin-top:2px}
  .chartbox{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .chartbox h4{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
  .chartwrap{position:relative;width:100%;height:280px}
  .postrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .postrow:first-of-type{border-top:none}
  .postrow .cap{flex:1;font-size:13px}
  .postrow .num{font-weight:800;font-size:14px}
  .demo-banner{background:#2a2410;border:1px solid #574a1a;color:var(--gold);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}
  /* Operazioni */
  .ops-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;margin-bottom:16px}
  .ops-title{font-size:22px;line-height:1.2;margin:0 0 4px}
  .ops-sync{font:500 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);text-align:right}
  .ops-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px;background:var(--panel2)}
  .ops-kpi{padding:12px 14px;border-right:1px solid var(--line)}
  .ops-kpi:last-child{border-right:0}
  .ops-kpi strong{display:block;font:700 22px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--txt)}
  .ops-kpi span{font-size:11px;color:var(--mut)}
  .ops-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr);gap:16px;align-items:start}
  .ops-section{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
  .ops-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .ops-section-head h3{font-size:13px;margin:0}
  .ops-count{font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut)}
  .ops-row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;border-bottom:1px solid var(--line)}
  .ops-row:last-child{border-bottom:0}
  .ops-priority{font:700 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;color:var(--mut)}
  .ops-priority.p0,.ops-priority.blocked{color:var(--red)}
  .ops-priority.p1{color:var(--gold)}
  .ops-main b{display:block;font-size:13px;line-height:1.35;margin-bottom:3px}
  .ops-main small{display:block;color:var(--mut);font-size:11px;line-height:1.4}
  .ops-status{font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;color:var(--mut);white-space:nowrap}
  .ops-status.recording,.ops-status.approved{color:var(--green)}
  .ops-status.editing,.ops-status.review,.ops-status.proposed{color:var(--gold)}
  .ops-alert{padding:12px 14px;background:#271719;color:#ff9b9b;border-bottom:1px solid #4a2528;font-size:12px}
  .ops-empty{padding:18px 14px;color:var(--mut);font-size:12px}
  .ops-links{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px}
  .ops-links .btn{padding:8px 10px;font-size:12px;text-decoration:none}
  .plan-progress{height:10px;border-radius:999px;background:#151b26;overflow:hidden;border:1px solid var(--line);margin:10px 0 4px}
  .plan-progress>span{display:block;height:100%;border-radius:inherit;background:var(--accent,var(--gold));transition:width .25s ease}
  .plan-phase{border-bottom:1px solid var(--line)}
  .plan-phase:last-child{border-bottom:0}
  .plan-phase>summary{min-height:44px;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
  .plan-phase>summary::-webkit-details-marker{display:none}
  .plan-phase-no{font:800 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut)}
  .plan-phase-title{font-size:13px;font-weight:700}
  .plan-phase-meta{font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);white-space:nowrap}
  .plan-section-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px 14px}
  .plan-section-card{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .plan-section-card b{display:block;font-size:12px;margin-bottom:6px}
  .plan-section-card strong{font:700 22px/1 ui-monospace,SFMono-Regular,Menlo,monospace}
  .plan-section-card small{display:block;color:var(--mut);font-size:10px;margin-top:5px}
  @media(max-width:760px){
    .ops-head{grid-template-columns:1fr}.ops-sync{text-align:left}
    .ops-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.ops-kpi:nth-child(2){border-right:0}.ops-kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}
    .ops-layout{grid-template-columns:1fr}.ops-row{grid-template-columns:64px minmax(0,1fr)}.ops-status{grid-column:2}
    .plan-section-grid{grid-template-columns:1fr}
  }
  /* Command Center + Content Intelligence */
  .cc-badge{font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:3px 7px;border-radius:5px;text-transform:uppercase;white-space:nowrap}
  .cc-badge.urgent,.cc-badge.critical{background:rgba(255,107,107,.15);color:var(--red)}
  .cc-badge.attention,.cc-badge.high{background:rgba(230,182,76,.15);color:var(--gold)}
  .cc-badge.normal,.cc-badge.low{background:#1a2130;color:var(--mut)}
  .cc-badge.ok{background:rgba(62,207,142,.15);color:var(--green)}
  .cc-tname{font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);text-transform:uppercase}
  .cc-details{border-top:1px solid var(--line)}
  .cc-details>summary{cursor:pointer;padding:10px 14px;font-size:12px;color:var(--mut);list-style:none;display:flex;align-items:center;gap:8px}
  .cc-details>summary::-webkit-details-marker{display:none}
  .cc-details>summary::before{content:"\u25b8";color:var(--accent,var(--gold))}
  .cc-details[open]>summary::before{content:"\u25be"}
  .cc-replay{padding:2px 14px 12px 28px;font:400 11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut)}
  .cc-replay .step{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-top:1px dashed var(--line)}
  .cc-replay .step:first-child{border-top:none}
  .cc-replay .step .r-fail{color:var(--red)}
  .cc-table{width:100%;border-collapse:collapse;font-size:12px}
  .cc-table th,.cc-table td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  .cc-table th{color:var(--mut);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.4px}
  .cc-table td.num,.cc-table th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .cc-table tr:last-child td{border-bottom:none}
  .cc-tablewrap{overflow-x:auto}
  .rec{display:inline-block;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
  .rec.good{background:rgba(62,207,142,.15);color:var(--green)}
  .rec.warn{background:rgba(230,182,76,.15);color:var(--gold)}
  .rec.bad{background:rgba(255,107,107,.15);color:var(--red)}
  .rec.muted{background:#1a2130;color:var(--mut)}
  .intel-sel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .intel-sel .chip{padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--mut);cursor:pointer;font-size:12px;font-weight:600}
  .intel-sel .chip.on{background:var(--accent,var(--gold));color:#0b0e14;border-color:transparent}
  .filters{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:10px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
  .filters .flabel{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin-right:2px}
  .filters .fgroup{display:flex;gap:4px}
  .filters .fbtn{padding:5px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--mut);cursor:pointer;font-size:11px;font-weight:600}
  .filters .fbtn.on{background:var(--accent,var(--gold));color:#0b0e14;border-color:transparent}
  .cc-note{font-size:11px;color:var(--mut);padding:10px 14px}
  @media(max-width:760px){
    .cc-table thead{display:none}
    .cc-table,.cc-table tbody,.cc-table tr,.cc-table td{display:block;width:100%}
    .cc-table tr{border-bottom:1px solid var(--line);padding:6px 0}
    .cc-table td{border-bottom:none;padding:3px 12px;text-align:left!important}
    .cc-table td.num{text-align:left}
    .cc-table td[data-l]::before{content:attr(data-l) ": ";color:var(--mut);font-size:10px;text-transform:uppercase}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  /* Talent Studio shell — progressive disclosure over the existing secure data gateways. */
  :root{
    --bg:#020617;--panel:#0f172a;--panel2:#0b1220;--line:#273449;
    --txt:#f8fafc;--mut:#94a3b8;--green:#22c55e;--red:#ef4444;
  }
  html{scroll-behavior:smooth}
  body{min-height:100vh;background:
    radial-gradient(circle at 8% -10%,color-mix(in srgb,var(--accent,var(--gold)) 12%,transparent),transparent 33rem),
    var(--bg)}
  button,input{font:inherit}
  .skip-link{position:fixed;left:12px;top:12px;z-index:100;transform:translateY(-160%);background:var(--txt);color:var(--bg);padding:10px 14px;border-radius:8px;font-weight:800}
  .skip-link:focus{transform:translateY(0)}
  .wrap{max-width:1360px;padding:22px 24px 40px}
  header{min-height:58px;padding-bottom:12px;border-bottom:1px solid color-mix(in srgb,var(--line) 72%,transparent)}
  .brand{font-size:18px;letter-spacing:-.02em}.brand small{display:block;margin-top:2px;color:var(--mut);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  .tabs{gap:4px;padding:5px;background:rgba(15,23,42,.82);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px)}
  .tab{border:0;border-radius:9px;background:transparent;transition:background-color .18s ease,color .18s ease,transform .18s ease}
  .tab:hover{background:#172033;color:var(--txt)}
  .tab:active{transform:scale(.98)}
  .tab.on{box-shadow:0 8px 28px color-mix(in srgb,var(--accent,var(--gold)) 22%,transparent)}
  #content{min-height:520px}
  .studio-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;padding:22px 0 18px}
  .studio-eyebrow{color:var(--accent,var(--gold));font:800 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase}
  .studio-title{margin:7px 0 5px;font-size:clamp(25px,4vw,38px);line-height:1.08;letter-spacing:-.035em}
  .studio-lead{margin:0;max-width:690px;color:var(--mut);font-size:14px}
  .studio-fresh{display:flex;align-items:center;gap:7px;color:var(--mut);font:600 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}
  .studio-fresh::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(34,197,94,.1)}
  .studio-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-bottom:18px}
  .studio-card{grid-column:span 4;background:linear-gradient(145deg,rgba(15,23,42,.96),rgba(8,15,28,.98));border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
  .studio-card.wide{grid-column:span 8}.studio-card.full{grid-column:1/-1}
  .studio-card h2,.studio-card h3{margin:0}.studio-card h2{font-size:17px}.studio-card h3{font-size:13px}
  .studio-card-head{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:13px}
  .studio-kicker{color:var(--mut);font-size:11px;margin-top:3px}
  .studio-list{display:flex;flex-direction:column}
  .studio-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .studio-item:first-child{border-top:0;padding-top:0}.studio-item:last-child{padding-bottom:0}
  .studio-item b{display:block;font-size:13px;line-height:1.35}.studio-item small{display:block;color:var(--mut);font-size:11px;line-height:1.45;margin-top:3px}
  .studio-action{align-self:start;border:1px solid var(--line);border-radius:8px;background:#111c30;color:var(--txt);padding:7px 9px;font-size:11px;font-weight:750;text-decoration:none;white-space:nowrap;cursor:pointer}
  .studio-action:hover{border-color:var(--accent,var(--gold));color:var(--accent,var(--gold))}
  .studio-action:focus-visible{outline:2px solid var(--accent,var(--gold));outline-offset:2px}
  .studio-action[disabled]{cursor:not-allowed;opacity:.58}
  .ad-inventory-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
  .ad-inventory-actions .studio-action{min-height:44px;padding:10px 13px}
  .ad-inventory-actions .primary{background:var(--accent,var(--gold));border-color:var(--accent,var(--gold));color:#07111f}
  .ad-inventory-actions .primary:hover{filter:brightness(1.08);color:#07111f}
  .ad-inventory-card{transition:border-color 180ms ease,background-color 180ms ease,opacity 180ms ease,transform 180ms ease}
  .ad-inventory-card.is-claimed{border-color:#27c281;background:linear-gradient(180deg,rgba(39,194,129,.09),var(--panel))}
  .ad-inventory-card.is-busy{opacity:.58;transform:scale(.995);pointer-events:none}
  .ad-inventory-status{min-height:22px;margin:10px 0 0;color:var(--muted);font-size:12px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function(){
  var SB_URL='https://iuvkbjmgxbkhrvuervrz.supabase.co';
  var SB_KEY='sb_publishable_ntOoKJdAdZs0CcR_BClaew_oRsq1uiC';
  var COLORS={alberto:'#3ecf8e',marco:'#5aa9ff',jj:'#e6b64c',claudia:'#b48cff',samantha:'#ff6b6b',nabil:'#22d3ee',luca:'#ff7a1a'};
  var NAMES={alberto:'Alberto',marco:'No Matrix',jj:'JJ',claudia:'Claudia',samantha:'Samantha',nabil:'Nabil',luca:'Luca Puleo'};
  var PLAT={ig:'IG Reels',tiktok:'TikTok'};
  var NEWS_URL='index.html';

  var sb=null;
  function ensureSb(){ if(!sb && window.supabase){ try{ sb=window.supabase.createClient(SB_URL,SB_KEY);}catch(e){sb=null;} } return sb; }

  var AUTH='bullshub_auth_v1';
  function load(k,d){ try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;} }
  function save(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
  function del(k){ try{localStorage.removeItem(k);}catch(e){} }

  function sessionUsable(a){
    if(!a||!a.id||!a.opsToken) return false;
    if(!a.opsExpiresAt) return true;
    var expiry=Date.parse(a.opsExpiresAt);
    return !isFinite(expiry)||expiry>Date.now()+30000;
  }

  var auth=load(AUTH,null);
  // Hub e newsroom vivono sullo stesso dominio: riusa la sessione valida invece
  // di costringere il talent a un secondo login. Una sessione scaduta non deve
  // mai lasciare le sezioni in uno stato apparentemente vuoto.
  if(!sessionUsable(auth)) auth=load('bullsfx_auth_v2',null);
  if(!sessionUsable(auth)){ auth=null; del(AUTH); }
  else save(AUTH,auth);
  var view='news';
  var reelsData=null;
  var productionFilter='all';
  var talentProductionCache=null;
  var talentAdInventoryBusy=false;
  var TALENT_LIVE_READ_ONLY=true;
  var legacySnapshotCache=null;
  var legacySnapshotAt=0;

  function loadLegacySnapshot(force){
    if(!auth||!auth.opsToken||!ensureSb()) return Promise.reject(new Error('sessione operativa non disponibile'));
    if(!force&&legacySnapshotCache&&Date.now()-legacySnapshotAt<30000) return Promise.resolve(legacySnapshotCache);
    return ensureSb().rpc('ops_legacy_talent_snapshot',{p_session_token:auth.opsToken}).then(function(res){
      if(res.error||!res.data){
        if(res.error&&/(invalid|expired).*session/i.test(String(res.error.message||res.error))){
          del(AUTH); auth=null; showLogin(); lgErr.textContent='Sessione scaduta. Inserisci di nuovo il tuo codice.';
        }
        throw (res.error||new Error('snapshot non disponibile'));
      }
      if(res.data.talent_id!==auth.id) throw new Error('perimetro talent non valido');
      legacySnapshotCache=res.data; legacySnapshotAt=Date.now(); return legacySnapshotCache;
    });
  }

  var loginEl=document.getElementById('login');
  var lgCode=document.getElementById('lg-code');
  var lgErr=document.getElementById('lg-err');
  var content=document.getElementById('content');

  function setAccent(tid){ document.documentElement.style.setProperty('--accent', COLORS[tid]||'#e6b64c'); }

  function showLogin(){ loginEl.style.display='flex'; lgErr.textContent=''; lgCode.value=''; setTimeout(function(){lgCode.focus();},50); }
  function hideLogin(){ loginEl.style.display='none'; }

  function doLogin(){
    var code=(lgCode.value||'').trim();
    if(!code){ lgErr.textContent='Inserisci il tuo codice.'; return; }
    var s=ensureSb(); if(!s){ lgErr.textContent='Connessione non disponibile. Riprova.'; return; }
    lgErr.textContent='Verifica\u2026';
    var clientRef=localStorage.getItem('jbgrl_client_ref');
    if(!clientRef){ clientRef='web_'+Array.from(crypto.getRandomValues(new Uint8Array(18)),function(x){return x.toString(16).padStart(2,'0');}).join(''); localStorage.setItem('jbgrl_client_ref',clientRef); }
    s.rpc('ops_login_code_v2',{p_pin:code,p_client_ref:clientRef}).then(function(res){
      var row=(res.data&&res.data[0])||null;
      if(res.error||!row){ lgErr.textContent=res.error&&String(res.error.message).includes('locked')?'Troppi tentativi. Riprova più tardi.':'Codice errato. Riprova.'; return; }
      auth={id:row.talent_id,color:row.color,opsToken:row.session_token,opsExpiresAt:row.expires_at};
      save(AUTH,auth); hideLogin(); boot();
    }, function(){ lgErr.textContent='Errore di connessione. Riprova.'; });
  }
  document.getElementById('lg-go').onclick=doLogin;
  lgCode.onkeydown=function(e){ if(e.key==='Enter') doLogin(); };
  document.getElementById('logout').onclick=function(){
    var token=auth&&auth.opsToken;
    if(token&&ensureSb()){ ensureSb().rpc('ops_logout',{p_session_token:token}); }
    del(AUTH); auth=null; location.reload();
  };

  // ---------------- PLATFORM PICKER ----------------
  var pickEl=document.getElementById('pick');
  var pickCb=null;
  Array.prototype.forEach.call(pickEl.querySelectorAll('[data-pf]'),function(b){
    b.onclick=function(){
      var v=b.getAttribute('data-pf'); pickEl.style.display='none';
      var cb=pickCb; pickCb=null; if(!cb) return;
      if(v==='cancel') cb(null);
      else if(v==='both') cb(['ig','tiktok']);
      else cb([v]);
    };
  });
  function askPlatform(cb){ pickCb=cb; pickEl.style.display='flex'; }

  // tabs
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
    t.setAttribute('role','tab');t.setAttribute('tabindex','0');
    t.onclick=function(){
      Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){x.classList.remove('on');x.setAttribute('aria-selected','false');});
      t.classList.add('on'); view=t.getAttribute('data-view'); render();
      t.setAttribute('aria-selected','true');
    };
    t.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();t.click();}};
  });

  function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function spinner(msg){ return '<div class="empty"><span class="spin" style="border-top-color:#8b95ab"></span> '+esc(msg)+'</div>'; }

  /*INTEL_START*/
  // Pure, side-effect-free logic (identity resolution, admin gating, leaderboard, angle recommendation).
  // Exposed on window.__intel so the Node test suite can exercise the exact shipped code.
  var INTEL=(function(){
    var DISPLAY={alberto:'Alberto',marco:'No Matrix',claudia:'Claudia',samantha:'Samantha',nabil:'Nabil',luca:'Luca Puleo',jj:'JJ'};
    var ALIASES={'alberto':'alberto','claudia':'claudia','samantha':'samantha','nabil':'nabil','jj':'jj',
      'marco':'marco','no matrix':'marco','nomatrix':'marco','nomatrix system':'marco',
      'luca':'luca','luca puleo':'luca'};
    // Operational affiliates only. jj is the administrator and is intentionally excluded.
    var AFFILIATES=['alberto','marco','claudia','samantha','nabil','luca'];
    var MIN_PUBLICATIONS=3, MIN_VIEWS=20000;
    function norm(s){ return (s==null?'':String(s)).trim().toLowerCase(); }
    function resolveTalent(name){ var k=norm(name); if(ALIASES[k]) return ALIASES[k]; return (AFFILIATES.indexOf(k)>=0||k==='jj')?k:k; }
    function displayName(id){ return DISPLAY[resolveTalent(id)]||id; }
    function isAdmin(id){ return resolveTalent(id)==='jj'; }
    function isAffiliate(id){ return AFFILIATES.indexOf(resolveTalent(id))>=0; }
    function leaderboard(rows){
      return (rows||[]).map(function(r){ return {id:resolveTalent(r.talent_id!=null?r.talent_id:r.id),ftd:Number(r.ftd||0),views:Number(r.views||0)}; })
        .filter(function(r){ return r.id!=='jj' && AFFILIATES.indexOf(r.id)>=0; })
        .sort(function(a,b){ return (b.ftd-a.ftd) || (b.views-a.views); });
    }
    // Never a "winner" on asset volume alone: a push requires publications + views + engagement + FTD evidence.
    function angleRecommendation(a){
      a=a||{};
      var pubs=Number(a.publications||0), views=Number(a.views||0), ftd=Number(a.ftd||0), ei=Number(a.engagement_index||0);
      if(pubs<MIN_PUBLICATIONS || views<MIN_VIEWS){
        return {label:'dati insufficienti',code:'insufficient',tone:'muted',
          reason:pubs+' pubbl. \u00b7 '+views.toLocaleString('it-IT')+' view (soglia '+MIN_PUBLICATIONS+' pubbl. / '+MIN_VIEWS.toLocaleString('it-IT')+' view)'};
      }
      if(ei>=55 && ftd>0) return {label:'spingi',code:'push',tone:'good',reason:'EI '+ei+' \u00b7 '+ftd+' FTD su '+pubs+' pubbl.'};
      if(ei>=35) return {label:'varia',code:'vary',tone:'warn',reason:'EI '+ei+' \u00b7 segnale medio, testa nuove varianti'};
      return {label:'sospendi',code:'stop',tone:'bad',reason:'EI '+ei+' \u00b7 '+ftd+' FTD, sotto soglia'};
    }
    return {DISPLAY:DISPLAY,ALIASES:ALIASES,AFFILIATES:AFFILIATES,MIN_PUBLICATIONS:MIN_PUBLICATIONS,MIN_VIEWS:MIN_VIEWS,
      resolveTalent:resolveTalent,displayName:displayName,isAdmin:isAdmin,isAffiliate:isAffiliate,
      leaderboard:leaderboard,angleRecommendation:angleRecommendation};
  })();
  if(typeof window!=='undefined'){ window.__intel=INTEL; }
  /*INTEL_END*/

        // Gli script organici sono un asset locale revisionato: la mancata

        (r.cta?'<div class="cta">'+esc(r.cta)+'</div>':'')+
        (r.regia?'<div class="amb">'+esc(r.regia)+'</div>':'')+
        '<div class="tick"><span class="muted">'+(isDone?'in metriche':'da pubblicare')+'</span></div>'+
      '</div>';

  }

  // ---------------- METRICHE ----------------
  function engIndex(m,win){
    var v = win==='7'?m.v7_views:m.v24_views;
    if(!v||v<=0) return null;
    var sv=(win==='7'?m.v7_saves:m.v24_saves)||0;
    var sh=(win==='7'?m.v7_shares:m.v24_shares)||0;
    var fo=(win==='7'?m.v7_follows:m.v24_follows)||0;
    var ct=(win==='7'?m.v7_cta:m.v24_cta)||0;
    return Math.round((sv + 2*sh + 3*fo + 4*ct)/v*1000*10)/10;
  }
  function loadMetriche(){
    content.innerHTML='<div class="empty"><span class="spin" style="border-top-color:#8b95ab"></span> Carico le metriche\u2026</div>';
    loadLegacySnapshot().then(function(data){ renderMetriche(data.metrics||[]); })
      .catch(function(){ content.innerHTML='<div class="empty">Sessione scaduta o modulo non disponibile.</div>'; });
  }
  function fieldBlock(title,win,m,locked,readOnly){
    var p=win==='7'?'v7_':'v24_';
    function f(key,label,step){
      var val=m[p+key];
      return '<div class="field"><label>'+label+'</label><input type="number" step="'+(step||'1')+'" data-mf="'+key+'" value="'+(val==null?'':val)+'" placeholder="0"'+(locked||readOnly?' disabled':'')+'></div>';
    }
    var savedAt = win==='7'? m.v7_at : m.v24_at;
    var stamp = savedAt ? ' \u00b7 salvato \u2713' : '';
    return '<div class="block'+(locked?' locked':'')+'" data-win="'+win+'">'+
      '<h4>'+title+stamp+(readOnly?' \u00b7 sola lettura':(locked?' \u2014 completa prima le 24h':''))+'</h4>'+
      '<div class="fields">'+
        f('views','Views')+
        f('retention','Retention %','0.1')+
        f('saves','Salvataggi')+
        f('shares','Condivisioni')+
        f('follows','Nuovi follow')+
        f('cta','Click CTA / bio')+
      '</div>'+
      (locked||readOnly?'':'<button class="btn primary saveblock" data-win="'+win+'" style="margin-top:10px;padding:8px 14px;font-size:13px">Salva '+(win==='7'?'7 giorni':'24h')+'</button>')+
    '</div>';
  }
  function renderMetriche(rows){
    if(!rows.length){ content.innerHTML='<div class="empty">Nessun contenuto concluso ancora.<br>Spunta un\u2019ad o un reel come <b>fatto</b> per portarlo qui.</div>'; return; }
    var cards=rows.map(function(m){
      var pf = m.platform==='ig'?'ig':'tt';
      var locked = !m.v24_at;
      var f24 = fieldBlock('24h \u2014 primo snapshot','24',m,false,TALENT_LIVE_READ_ONLY);
      var f7 = fieldBlock('7 giorni \u2014 snapshot finale','7',m,locked,TALENT_LIVE_READ_ONLY);
      var i24=engIndex(m,'24'), i7=engIndex(m,'7');
      var real = (i7!=null?i7:i24);
      var cmp='<div class="msub" style="margin-top:10px">Viral: '+
        (m.viral_pred!=null?'previsto <b>'+m.viral_pred+'</b>':'previsto \u2014')+
        ' \u00b7 reale <span class="idx">'+(real!=null?real:'\u2014')+'</span> <span class="msub">(engagement / 1000 views)</span></div>';
      return '<div class="mcard" data-id="'+esc(m.item_id)+'" data-pf="'+esc(m.platform)+'">'+
        '<div class="mtop"><div><div class="mtitle">'+esc(m.title||m.item_id)+'</div>'+
          '<div class="msub">'+esc(m.hook||'')+'</div></div>'+
          '<div style="text-align:right"><span class="pill '+pf+'">'+(PLAT[m.platform]||m.platform)+'</span> '+
          '<span class="pill">'+(m.item_type==='reel'?'ORGANICO':'ADS')+'</span></div></div>'+
        f24 + f7 +
        '<div style="margin-top:10px"><input type="text" data-f="note" value="'+esc(m.note||'')+'" placeholder="note (facoltative)" disabled style="width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:8px"></div>'+
        cmp +
      '</div>';
    }).join('');
    content.innerHTML='<div class="bar"><div class="muted">Metriche in sola lettura durante il pilot. Gli aggiornamenti arrivano dai flussi operativi verificati.</div></div>'+cards;
  }

  // ---------------- ANALISI ----------------
  var _charts=[];
  function destroyCharts(){ _charts.forEach(function(c){ try{c.destroy();}catch(e){} }); _charts=[]; }
  function fmtInt(n){ return Math.round(n||0).toLocaleString('it-IT'); }
  function fmtEur(n){ return '\u20ac'+Math.round(n||0).toLocaleString('it-IT'); }
  function loadAnalisi(){
    destroyCharts();
    content.innerHTML='<div class="empty"><span class="spin" style="border-top-color:#8b95ab"></span> Carico l\u2019analisi\u2026</div>';
    loadLegacySnapshot().then(function(data){
      renderAnalisi(data.social_ads_daily||[],data.social_daily||[],data.social_posts||[],data.social_accounts||[]);
    }).catch(function(){ content.innerHTML='<div class="empty">Sessione scaduta o modulo non disponibile.</div>'; });
  }
  function renderAnalisi(ads,daily,posts,accts){
    if(!(ads.length||daily.length||posts.length)){
      content.innerHTML='<div class="empty">Nessun dato ancora.<br>Appena i profili social sono collegati, qui vedrai spesa, ROAS, crescita follower e i post migliori.</div>'; return;
    }
    var isDemo=!accts.some(function(a){return a.token_status==='active';});
    var spend=0,leads=0,rev=0;
    ads.forEach(function(a){ spend+=Number(a.spend||0); leads+=Number(a.leads||0); rev+=Number(a.revenue||0); });
    var roas=spend>0?rev/spend:0, cpl=leads>0?spend/leads:0;
    var byDay={};
    daily.forEach(function(d){ byDay[d.day]=(byDay[d.day]||0)+Number(d.followers||0); });
    var fdays=Object.keys(byDay).sort(), fvals=fdays.map(function(d){return byDay[d];});
    var fgrow=fvals.length>1?fvals[fvals.length-1]-fvals[0]:0;
    var adM={};
    ads.forEach(function(a){ if(!adM[a.day])adM[a.day]={spend:0,leads:0}; adM[a.day].spend+=Number(a.spend||0); adM[a.day].leads+=Number(a.leads||0); });
    var adays=Object.keys(adM).sort();
    var aspend=adays.map(function(d){return Math.round(adM[d].spend);});
    var aleads=adays.map(function(d){return adM[d].leads;});

    var banner=isDemo?'<div class="demo-banner">Stai vedendo <b>dati di esempio</b>. Appena il token Meta \u00e8 attivo, questi grafici si riempiono con i numeri reali.</div>':'';
    var stats='<div class="stats">'+
      '<div class="stat"><div class="lbl">Spesa (30gg)</div><div class="val">'+fmtEur(spend)+'</div></div>'+
      '<div class="stat"><div class="lbl">ROAS medio</div><div class="val">'+(Math.round(roas*10)/10).toLocaleString('it-IT')+'\u00d7</div></div>'+
      '<div class="stat"><div class="lbl">Lead (30gg)</div><div class="val">'+fmtInt(leads)+'</div><div class="sub">costo/lead '+fmtEur(cpl)+'</div></div>'+
      '<div class="stat"><div class="lbl">Follower +30gg</div><div class="val">'+(fgrow>=0?'+':'')+fmtInt(fgrow)+'</div></div>'+
    '</div>';
    var charts='<div class="chartbox"><h4>Spesa e lead per giorno</h4><div class="chartwrap"><canvas id="cAds"></canvas></div></div>'+
      '<div class="chartbox"><h4>Crescita follower \u00b7 30 giorni</h4><div class="chartwrap"><canvas id="cFol"></canvas></div></div>';
    var postHtml='';
    if(posts.length){
      postHtml='<div class="chartbox"><h4>Post organici migliori</h4>'+posts.map(function(p){
        return '<div class="postrow"><span class="pill '+(p.platform==='tiktok'?'tt':'ig')+'">'+(p.platform==='tiktok'?'TikTok':'IG')+'</span>'+
          '<span class="cap">'+esc(p.caption||p.id)+'</span>'+
          '<span class="num">'+fmtInt(p.views)+' <span class="msub" style="font-weight:400;color:var(--mut)">views</span></span></div>';
      }).join('')+'</div>';
    }
    content.innerHTML=banner+stats+charts+postHtml;

    var accent=COLORS[auth.id]||'#e6b64c';
    if(adays.length && window.Chart){
      _charts.push(new Chart(document.getElementById('cAds'),{
        data:{labels:adays,datasets:[
          {type:'bar',label:'Spesa (\u20ac)',data:aspend,backgroundColor:accent,yAxisID:'y'},
          {type:'line',label:'Lead',data:aleads,borderColor:'#3ecf8e',backgroundColor:'#3ecf8e',pointRadius:0,borderWidth:2,tension:.3,yAxisID:'y1'}
        ]},
        options:{responsive:true,maintainAspectRatio:false,
          plugins:{legend:{labels:{color:'#8b95ab'}}},
          scales:{
            x:{ticks:{color:'#8b95ab',maxTicksLimit:6},grid:{color:'#1e2634'}},
            y:{position:'left',ticks:{color:'#8b95ab',callback:function(v){return '\u20ac'+v;}},grid:{color:'#1e2634'}},
            y1:{position:'right',ticks:{color:'#8b95ab'},grid:{drawOnChartArea:false}}
          }}
      }));
    }
    if(fdays.length && window.Chart){
      _charts.push(new Chart(document.getElementById('cFol'),{
        type:'line',
        data:{labels:fdays,datasets:[{label:'Follower',data:fvals,borderColor:accent,backgroundColor:accent,pointRadius:0,borderWidth:2,tension:.3,fill:false}]},
        options:{responsive:true,maintainAspectRatio:false,
          plugins:{legend:{display:false}},
          scales:{
            x:{ticks:{color:'#8b95ab',maxTicksLimit:6},grid:{color:'#1e2634'}},
            y:{ticks:{color:'#8b95ab',callback:function(v){return (v/1000).toFixed(0)+'k';}},grid:{color:'#1e2634'}}
          }}
      }));
    }
  }

  // ---------------- OPERAZIONI ----------------
  function opsFixtureEnabled(){
    return /(?:^|[?&])ops_fixture=1(?:&|$)/.test(location.search) && (location.hostname==='localhost' || location.hostname==='127.0.0.1');
  }
  function opsDate(v){
    if(!v) return 'senza scadenza';
    try{return new Intl.DateTimeFormat('it-IT',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(v));}
    catch(e){return v;}
  }
  function opsStatus(s){ return esc((s||'da fare').replace(/_/g,' ')); }
  function opsSafeSlackUrl(v){
    try{var u=new URL(v); return u.protocol==='https:' && /(^|\.)slack\.com$/i.test(u.hostname) ? u.href : '';}
    catch(e){return '';}
  }
  function opsSafeDriveUrl(v){
    try{var u=new URL(v); return u.protocol==='https:' && /(^|\.)(drive|docs)\.google\.com$/i.test(u.hostname) ? u.href : '';}
    catch(e){return '';}
  }
  function loadOperazioni(){
    destroyCharts();
    content.innerHTML='<div class="empty"><span class="spin" style="border-top-color:#8b95ab"></span> Preparo la tua sala operativa...</div>';
    if(opsFixtureEnabled()){
      fetch('fixtures/operations.sample.json').then(function(r){if(!r.ok)throw new Error('fixture');return r.json();})
        .then(renderOperazioni).catch(function(){renderOpsError('Fixture operativa non disponibile.');});
      return;
    }
    if(!auth.opsToken){
      content.innerHTML='<div class="empty"><b>Sessione operativa da attivare</b><br>Esci e accedi di nuovo con il tuo codice personale. Ads e metriche continuano a funzionare normalmente.</div>';
      return;
    }
    ensureSb().rpc('ops_dashboard_snapshot',{p_session_token:auth.opsToken}).then(function(res){
      if(res.error||!res.data){
        if(/expired|invalid/i.test((res.error&&res.error.message)||'')){ delete auth.opsToken; save(AUTH,auth); }
        renderOpsError('Non riesco a caricare le operazioni. Riprova tra poco.'); return;
      }
      renderOperazioni(res.data);
    },function(){renderOpsError('Connessione operativa non disponibile.');});
  }
  function renderOpsError(message){
    content.innerHTML='<div class="empty">'+esc(message)+'<br><button class="btn" id="ops-retry" style="margin-top:12px">Riprova</button></div>';
    var b=document.getElementById('ops-retry'); if(b)b.onclick=loadOperazioni;
  }
  function renderOperazioni(data){
    if(!data || data.talent_id!==auth.id){ renderOpsError('Risposta operativa non valida.'); return; }
    var tasks=data.tasks||[], decisions=data.decisions||[], items=data.content||[], hooks=data.hooks||[], assets=data.assets||[], quarantine=Number(data.quarantine_count||0);
    var blockers=tasks.filter(function(t){return t.status==='blocked'||(t.brief&&t.brief.blocker);});
    var due=tasks.filter(function(t){return t.status!=='blocked';});
    function taskRows(rows){
      if(!rows.length)return '<div class="ops-empty">Nessun elemento in coda.</div>';
      return rows.map(function(t){
        var p=Number(t.priority); var blocker=t.status==='blocked'||(t.brief&&t.brief.blocker);
        var detail=blocker?(t.brief&&t.brief.blocker):(t.brief&&t.brief.next_action);
        return '<div class="ops-row"><span class="ops-priority '+(blocker?'blocked':'p'+p)+'">'+(blocker?'blocco':'P'+p)+'</span>'+
          '<div class="ops-main"><b>'+esc(t.title)+'</b><small>'+esc(detail||t.task_type||'Task operativo')+' | '+esc(opsDate(t.due_at))+'</small></div>'+
          '<span class="ops-status '+esc(t.status)+'">'+opsStatus(t.status)+'</span></div>';
      }).join('');
    }
    function contentRows(rows){
      if(!rows.length)return '<div class="ops-empty">Nessun contenuto attivo.</div>';
      return rows.map(function(c){
        return '<div class="ops-row"><span class="ops-priority">'+esc((c.content_type||'altro').slice(0,8))+'</span>'+
          '<div class="ops-main"><b>'+esc(c.title)+'</b><small>'+esc(c.content_code||'codice in assegnazione')+(c.angle?' | '+esc(c.angle):'')+'</small></div>'+
          '<span class="ops-status '+esc(c.lifecycle_status)+'">'+opsStatus(c.lifecycle_status)+'</span></div>';
      }).join('');
    }
    function decisionRows(rows){
      if(!rows.length)return '<div class="ops-empty">Nessuna decisione richiesta.</div>';
      return rows.map(function(d){
        return '<div class="ops-row"><span class="ops-priority '+(d.risk_level==='high'||d.risk_level==='critical'?'blocked':'p1')+'">'+esc(d.risk_level||'review')+'</span>'+
          '<div class="ops-main"><b>'+esc(d.title)+'</b><small>'+esc(d.rationale||'Richiede conferma umana')+'</small></div>'+
          '<span class="ops-status '+esc(d.status)+'">'+(d.approval_required?'approvazione':'verifica')+'</span></div>';
      }).join('');
    }
    function hookRows(rows){
      if(!rows.length)return '<div class="ops-empty">I pattern appariranno quando superano la soglia minima di evidenza.</div>';
      return rows.map(function(h){
        return '<div class="ops-row"><span class="ops-priority">'+esc(h.platform||'multi')+'</span><div class="ops-main"><b>'+esc(h.hook_text)+'</b><small>'+Number(h.publications||0)+' pubblicazioni | '+fmtInt(h.views)+' view | '+Number(h.ftd||0)+' FTD</small></div><span class="ops-status approved">EI '+Number(h.engagement_index||0).toLocaleString('it-IT')+'</span></div>';
      }).join('');
    }
    function assetRows(rows){
      if(!rows.length)return '<div class="ops-empty">Nessun asset collegato.</div>';
      return rows.map(function(a){
        var url=opsSafeDriveUrl(a.url); var title=url?'<a target="_blank" rel="noopener noreferrer" href="'+esc(url)+'">'+esc(a.file_name)+'</a>':esc(a.file_name);
        return '<div class="ops-row"><span class="ops-priority">'+esc(a.asset_type||'file')+'</span><div class="ops-main"><b>'+title+'</b><small>'+esc(a.content_code||a.content_title||'contenuto')+' | versione '+Number(a.version||1)+'</small></div><span class="ops-status '+esc(a.status)+'">'+opsStatus(a.status)+'</span></div>';
      }).join('');
    }
    var links=(data.slack_links||[]).map(function(l){var url=opsSafeSlackUrl(l.url);return url?'<a class="btn" target="_blank" rel="noopener noreferrer" href="'+esc(url)+'">'+esc(l.label||l.purpose||'Apri Slack')+'</a>':'';}).join('');
    var alert=quarantine?'<div class="ops-alert"><b>'+quarantine+' anomal'+(quarantine===1?'ia':'ie')+' dati</b> in quarantena. I numeri coinvolti non vengono usati dagli agenti finché non sono verificati.</div>':'';
    content.innerHTML='<div class="ops-head"><div><h2 class="ops-title">Sala operativa di '+esc(NAMES[auth.id]||auth.id)+'</h2><div class="muted">Priorità, blocchi, contenuti e decisioni in un solo posto.</div></div><div class="ops-sync">Aggiornato '+esc(opsDate(data.generated_at))+'</div></div>'+
      '<div class="ops-kpis"><div class="ops-kpi"><strong>'+due.length+'</strong><span>azioni aperte</span></div><div class="ops-kpi"><strong>'+blockers.length+'</strong><span>blocchi</span></div><div class="ops-kpi"><strong>'+items.length+'</strong><span>contenuti in corso</span></div><div class="ops-kpi"><strong>'+decisions.length+'</strong><span>decisioni richieste</span></div></div>'+
      alert+'<div class="ops-layout"><div><section class="ops-section"><div class="ops-section-head"><h3>Prossime azioni</h3><span class="ops-count">'+due.length+'</span></div>'+taskRows(due)+'</section>'+
      '<section class="ops-section"><div class="ops-section-head"><h3>Produzione contenuti</h3><span class="ops-count">'+items.length+'</span></div>'+contentRows(items)+'</section>'+
      '<section class="ops-section"><div class="ops-section-head"><h3>Hook Intelligence</h3><span class="ops-count">'+hooks.length+'</span></div>'+hookRows(hooks)+'</section></div>'+
      '<aside><section class="ops-section"><div class="ops-section-head"><h3>Blocchi</h3><span class="ops-count">'+blockers.length+'</span></div>'+taskRows(blockers)+'</section>'+
      '<section class="ops-section"><div class="ops-section-head"><h3>Decisioni</h3><span class="ops-count">'+decisions.length+'</span></div>'+decisionRows(decisions)+'</section>'+
      '<section class="ops-section"><div class="ops-section-head"><h3>Asset Drive</h3><span class="ops-count">'+assets.length+'</span></div>'+assetRows(assets)+'</section>'+
      (links?'<section class="ops-section"><div class="ops-section-head"><h3>Stanze Slack</h3></div><div class="ops-links">'+links+'</div></section>':'')+'</aside></div>';
  }

  // ---------------- PIANO TALENT ----------------
  var _launchPlans=[];
  var _launchIntel={};
  var PLAN_SEL_KEY='jbgrl_launch_plan_selected';
  function loadPiano(){
    if(!INTEL.isAdmin(auth.id)){content.innerHTML='<div class="empty">Sezione riservata agli amministratori.</div>';return;}
    destroyCharts();content.innerHTML=spinner('Carico il controllo talent...');
    if(opsFixtureEnabled()){
      Promise.all([
        fetch('fixtures/talent-plan.sample.json').then(function(r){if(!r.ok)throw 0;return r.json();}),
        fetch('fixtures/content-intelligence.sample.json').then(function(r){if(!r.ok)throw 0;return r.json();})
      ]).then(function(rows){renderPiano(rows[0],((rows[1].content_intelligence||{}).affiliates)||[]);})

  function ccSecs(s){
    s=Number(s); if(!isFinite(s)) return '\u2014';
    if(s<=0) return 'scaduto';

    var h=Math.floor(s/3600), m=Math.round((s%3600)/60); return h+'h '+m+'m';
  }

        .then(function(r){finish(list,creativeRpcPayload(r));},function(e){finish(list,{_load_error:String(e&&e.message||'Connessione Creative Brain non disponibile')});});
    }

      ]).then(function(rows){ finish((rows[0].content_intelligence&&rows[0].content_intelligence.affiliates)||[],rows[1]||{}); })
        .catch(function(){ renderCCError('Fixture intelligence non disponibile.',loadIntelligence); });

    ensureSb().rpc('ops_dashboard_snapshot',{p_session_token:auth.opsToken}).then(function(res){
      if(res.error||!res.data){
        if(res.error&&/(invalid|expired).*session/i.test(String(res.error.message||res.error))){del(AUTH);auth=null;showLogin();lgErr.textContent='Sessione scaduta. Inserisci di nuovo il tuo codice.';return;}
        renderCCError('Non riesco a caricare la Content Intelligence.',loadIntelligence); return;

  function affiliateFromSnapshot(data){
    var id=INTEL.resolveTalent(data.talent_id);
    var content_items=data.content||[], hooks=data.hooks||[], assets=data.assets||[];
    var mixMap={};
    content_items.forEach(function(c){
      var key=(c.content_type||'unknown')+'|'+(c.angle||'unclassified');
      if(!mixMap[key]) mixMap[key]={angle:c.angle||'unclassified',content_type:c.content_type||'unknown',asset_count:0,hook_count:0,mapped_count:0,publications:0,views:0,ftd:0,engagement_index:0};
      mixMap[key].asset_count++;
    });

      '<div class="studio-segment" role="group" aria-label="Filtra produzione"><button type="button" data-production-filter="all" class="'+(productionFilter==='all'?'on':'')+'">Tutti</button><button type="button" data-production-filter="ads" class="'+(productionFilter==='ads'?'on':'')+'">Ads</button><button type="button" data-production-filter="organic" class="'+(productionFilter==='organic'?'on':'')+'">Organico</button></div>'+
      '<div class="bar"><div class="muted"><b>'+all.length+'</b> contenuti · ne mostro '+shown.length+' per mantenere la vista leggibile</div></div><div class="studio-production">'+cards+'</div>';
    Array.prototype.forEach.call(content.querySelectorAll('[data-production-filter]'),function(b){b.onclick=function(){productionFilter=b.getAttribute('data-production-filter');renderTalentProduction();};});

  function loadTalentResults(){
    destroyCharts();content.innerHTML=spinner('Leggo i tuoi risultati…');
    Promise.all([
      loadLegacySnapshot(),
      ensureSb().rpc('ops_dashboard_snapshot',{p_session_token:auth.opsToken}),
      ensureSb().rpc('ops_organic_tracking_snapshot',{p_session_token:auth.opsToken})
    ]).then(function(rows){
      var ops=rows[1].error?{}:(rows[1].data||{}),list=(((ops.content_intelligence||{}).affiliates)||[]),org=rows[2];
      if(!org.error&&org.data)list=attachOrganicTracking(list,org.data);
      var aff=list.filter(function(x){return INTEL.resolveTalent(x.talent_id)===INTEL.resolveTalent(auth.id);})[0]||affiliateFromSnapshot(ops);
      renderTalentResults(rows[0],aff,ops.generated_at);

  function renderTalentResults(data,aff,generatedAt){
    data=data||{};aff=aff||{};
    var ads=data.social_ads_daily||[],daily=data.social_daily||[],posts=data.social_posts||[],spend=0,leads=0,rev=0;
    ads.forEach(function(a){spend+=Number(a.spend||0);leads+=Number(a.leads||0);rev+=Number(a.revenue||0);});
    var roas=spend>0?rev/spend:0,cpl=leads>0?spend/leads:0,byDay={};
    daily.forEach(function(d){byDay[d.day]=(byDay[d.day]||0)+Number(d.followers||0);});
    var days=Object.keys(byDay).sort(),growth=days.length>1?byDay[days[days.length-1]]-byDay[days[0]]:0;
    var recs=aff.organic_recommendations||[];
    function recBlock(code,cls,title,empty){var xs=recs.filter(function(r){return code.indexOf(r.recommendation)>=0;}).slice(0,5);return '<section class="studio-decision '+cls+'"><h3>'+title+'</h3>'+(xs.length?xs.map(function(r){return '<div class="ops-row"><div class="ops-main"><b>'+esc(String(r.angle||'Angolo'))+'</b><small>'+esc(studioRecLabel(r.recommendation))+' · '+Number(r.views||0).toLocaleString('it-IT')+' view</small></div></div>';}).join(''):studioEmpty(empty))+'</section>';}
    var topPosts=posts.slice().sort(function(a,b){return Number(b.views||0)-Number(a.views||0);}).slice(0,8);
    var postRows=topPosts.length?topPosts.map(function(p){return '<div class="studio-item"><div><span class="studio-signal">'+esc(String(p.platform||'social'))+'</span><b style="margin-top:8px">'+esc(String(p.caption||p.id||'Contenuto'))+'</b></div><strong>'+Number(p.views||0).toLocaleString('it-IT')+' view</strong></div>';}).join(''):studioEmpty('I contenuti migliori appariranno quando saranno collegate le fonti social ufficiali.');
    content.innerHTML=studioHero('Risultati','Numeri che portano a una decisione','Confronti, contenuti migliori e indicazioni operative del tuo solo perimetro.',generatedAt?'Aggiornato '+opsDate(generatedAt):'Ultimo snapshot verificato')+
      '<div class="ops-kpis"><div class="ops-kpi"><strong>'+fmtEur(spend)+'</strong><span>spesa 30 giorni</span></div><div class="ops-kpi"><strong>'+(Math.round(roas*10)/10).toLocaleString('it-IT')+'×</strong><span>ROAS</span></div><div class="ops-kpi"><strong>'+fmtInt(leads)+'</strong><span>lead · CPL '+fmtEur(cpl)+'</span></div><div class="ops-kpi"><strong>'+(growth>=0?'+':'')+fmtInt(growth)+'</strong><span>follower 30 giorni</span></div></div>'+
      '<div class="studio-decision-grid">'+recBlock(['create_variations'],'repeat','Ripeti','Nessun pattern ha ancora evidenza sufficiente per essere ripetuto.')+recBlock(['test_new_hook_or_format','collect_more_data'],'change','Cambia o testa','Nessuna variazione richiesta al momento.')+recBlock(['pause_and_review'],'stop','Ferma','Nessun contenuto da fermare con i dati disponibili.')+'</div>'+
      '<section class="studio-card full"><div class="studio-card-head"><div><h2>Contenuti migliori</h2><div class="studio-kicker">Ogni risultato resta collegato alla sua evidenza</div></div><button type="button" class="studio-action" data-studio-view="production">Apri produzione</button></div><div class="studio-list">'+postRows+'</div></section>';
    bindStudioLinks();
  }

  function loadTalentAgenda(){
    destroyCharts();content.innerHTML=spinner('Preparo agenda e priorità…');
    if(opsFixtureEnabled()){
      fetch('fixtures/operations.sample.json').then(function(r){return r.json();}).then(function(d){renderTalentAgenda(d,{meetings:[]});});return;
    }
    Promise.all([
      ensureSb().rpc('ops_dashboard_snapshot',{p_session_token:auth.opsToken}),
      ensureSb().rpc('ops_call_execution_snapshot',{p_session_token:auth.opsToken})
    ]).then(function(rows){if(rows[0].error||!rows[0].data)throw new Error('agenda');renderTalentAgenda(rows[0].data,rows[1].error?{}:(rows[1].data||{}));})
      .catch(function(){content.innerHTML='<div class="empty">Agenda non disponibile. Riprova tra poco.</div>';});
  }
  function renderTalentAgenda(data,calls){
    if(!data||data.talent_id!==auth.id){content.innerHTML='<div class="empty">Perimetro agenda non valido.</div>';return;}
    var tasks=data.tasks||[],decisions=data.decisions||[],open=tasks.filter(function(t){return t.status!=='done'&&t.status!=='completed'&&t.status!=='blocked';}),blocked=tasks.filter(function(t){return t.status==='blocked'||(t.brief&&t.brief.blocker);});
    var meetings=(calls.meetings||[]).filter(function(m){return !m.talent_id||INTEL.resolveTalent(m.talent_id)===INTEL.resolveTalent(auth.id);}).slice(0,6);
    function taskRows(xs,empty){return xs.length?xs.slice(0,10).map(function(t){var detail=(t.brief&&((t.status==='blocked'&&t.brief.blocker)||t.brief.next_action))||t.task_type||'Task operativo';return '<div class="studio-item"><div><span class="studio-signal '+(t.status==='blocked'?'bad':(Number(t.priority||2)<=1?'warn':''))+'">P'+Number(t.priority||2)+'</span><b style="margin-top:8px">'+esc(String(t.title||'Task'))+'</b><small>'+esc(String(detail))+' · '+esc(opsDate(t.due_at))+'</small></div><span class="studio-signal">'+esc(opsStatus(t.status))+'</span></div>';}).join(''):studioEmpty(empty);}
    var decisionRows=decisions.length?decisions.slice(0,8).map(function(d){return '<div class="studio-item"><div><span class="studio-signal warn">decisione</span><b style="margin-top:8px">'+esc(String(d.title||'Decisione'))+'</b><small>'+esc(String(d.rationale||'Richiede conferma umana'))+'</small></div><span class="studio-signal">'+esc(String(d.status||'review'))+'</span></div>';}).join(''):studioEmpty('Nessuna decisione richiesta.');
    var meetingRows=meetings.length?meetings.map(function(m){return '<div class="studio-item"><div><span class="studio-signal good">call</span><b style="margin-top:8px">'+esc(String(m.meeting_type||'Aggiornamento'))+'</b><small>'+Number(m.action_items||0)+' action item · '+Number(m.ambiguous_items||0)+' da chiarire</small></div><span class="studio-signal">'+esc(opsDate(m.scheduled_start))+'</span></div>';}).join(''):studioEmpty('Le prossime call e i recap appariranno qui dopo l’elaborazione Fathom.');
    content.innerHTML=studioHero('Agenda','Cosa serve da te','Task, blocchi, call e decisioni senza rumore operativo.',data.generated_at?'Aggiornato '+opsDate(data.generated_at):'Snapshot operativo')+
      '<div class="ops-kpis"><div class="ops-kpi"><strong>'+open.length+'</strong><span>azioni aperte</span></div><div class="ops-kpi"><strong>'+blocked.length+'</strong><span>blocchi</span></div><div class="ops-kpi"><strong>'+decisions.length+'</strong><span>decisioni</span></div><div class="ops-kpi"><strong>'+meetings.length+'</strong><span>call</span></div></div>'+
      '<div class="studio-grid"><section class="studio-card wide"><div class="studio-card-head"><div><h2>Prossime azioni</h2><div class="studio-kicker">Ordinate per priorità e scadenza</div></div></div><div class="studio-list">'+taskRows(open,'Nessuna azione aperta.')+'</div></section><aside class="studio-card"><div class="studio-card-head"><div><h2>Blocchi</h2><div class="studio-kicker">Da sbloccare con il team JBGRL</div></div></div><div class="studio-list">'+taskRows(blocked,'Nessun blocco aperto.')+'</div></aside><section class="studio-card wide"><div class="studio-card-head"><div><h2>Call e recap</h2><div class="studio-kicker">Fathom traduce le call in azioni</div></div></div><div class="studio-list">'+meetingRows+'</div></section><section class="studio-card"><div class="studio-card-head"><div><h2>Decisioni</h2><div class="studio-kicker">Nessuna azione rischiosa è automatica</div></div></div><div class="studio-list">'+decisionRows+'</div></section></div>';
  }

  // ---------------- GENERALE ----------------
  function loadCallExecution(){
    destroyCharts();content.innerHTML=spinner('Carico call, priorità e funnel…');
    if(opsFixtureEnabled()){renderCallExecution({meetings:[],top_actions:[],funnel:[],opportunities:[]});return;}
    if(!auth.opsToken){content.innerHTML='<div class="empty">Sessione operativa da attivare.</div>';return;}
    ensureSb().rpc('ops_call_execution_snapshot',{p_session_token:auth.opsToken}).then(function(res){
      if(res.error||!res.data){renderCCError('Call Engine non disponibile.',loadCallExecution);return;}renderCallExecution(res.data);

  function loadMarketing(){
    destroyCharts();content.innerHTML=spinner('Carico la readiness marketing…');
    if(!auth||auth.id!=='jj'||!auth.opsToken||!ensureSb()){content.innerHTML='<div class="ops-empty">Area riservata agli admin.</div>';return;}
    ensureSb().rpc('ops_marketing_send_dashboard',{p_session_token:auth.opsToken}).then(function(res){
      if(res.error||!res.data){content.innerHTML='<div class="ops-empty">Readiness marketing non disponibile.</div>';return;}
      renderMarketingReadiness(res.data);
    },function(){content.innerHTML='<div class="ops-empty">Connessione operativa non disponibile.</div>';});

  function renderMarketingReadiness(m){
    m=m||{};var f=m.ftd_audience||{},d=m.deliverability||{},w=m.current_webinar,r=m.first_campaign_readiness;
    function statusRows(xs){xs=xs||[];return xs.length?xs.map(function(x){return '<div class="ops-row"><span class="ops-status">'+esc(x.status)+'</span><div class="ops-main"><b>'+Number(x.campaigns||0)+'</b><small>campagne</small></div></div>';}).join(''):'<div class="ops-empty">Nessuna campagna registrata.</div>';}
    var webinar=w?'<div class="ops-row"><span class="cc-badge normal">WEBINAR</span><div class="ops-main"><b>'+esc(w.webinar_id||'—')+' · '+esc(INTEL.displayName(w.talent_id))+'</b><small>'+Number(w.registered||0)+' registrati · '+Number(w.attended||0)+' presenti · '+Number(w.high_intent||0)+' alto intento</small></div></div>':'<div class="ops-empty">Nessun webinar registrato.</div>';
    var readiness=r?'<div class="ops-row"><div class="ops-main"><b>'+esc(r.name||'—')+'</b><small>'+esc(INTEL.displayName(r.talent_id))+' · '+esc(r.status)+' · scope '+esc(r.audience_scope||'—')+' · '+Number(r.eligible_contacts||0)+' idonei · '+Number(r.already_sent||0)+' già inviati</small></div></div>':'<div class="ops-empty">Nessuna campagna approvata o pianificata.</div>';
    content.innerHTML='<div class="ops-head"><div><h2 class="ops-title">Marketing readiness</h2><div class="muted">Solo conteggi aggregati — nessun indirizzo email o dato personale.</div></div><div class="ops-sync">Aggiornato '+esc(m.generated_at?opsDate(m.generated_at):'—')+'</div></div>'+
      '<div class="ops-kpis"><div class="ops-kpi"><strong>'+Number(f.pending||0)+'</strong><span>FTD pending</span></div><div class="ops-kpi"><strong>'+Number(f.eligible||0)+'</strong><span>FTD idonei</span></div><div class="ops-kpi"><strong>'+Number(f.suppressed||0)+'</strong><span>FTD soppressi</span></div><div class="ops-kpi"><strong>'+Number(m.consent_blocks||0)+'</strong><span>blocchi consenso</span></div></div>'+
      '<div class="ops-layout"><div><section class="ops-section"><div class="ops-section-head"><h3>Prima campagna</h3></div>'+readiness+'</section><section class="ops-section"><div class="ops-section-head"><h3>Webinar corrente</h3></div>'+webinar+'</section><section class="ops-section"><div class="ops-section-head"><h3>Deliverability</h3></div><div class="ops-row"><span class="ops-status">unsubscribe</span><div class="ops-main"><b>'+Number(d.unsubscribed||0)+'</b></div></div><div class="ops-row"><span class="ops-status">bounce</span><div class="ops-main"><b>'+Number(d.bounced||0)+'</b></div></div><div class="ops-row"><span class="ops-status">complaint</span><div class="ops-main"><b>'+Number(d.complained||0)+'</b></div></div></section></div><aside><section class="ops-section"><div class="ops-section-head"><h3>Futuri eventi</h3></div>'+statusRows(m.future_events)+'</section><section class="ops-section"><div class="ops-section-head"><h3>Future offerte</h3></div>'+statusRows(m.future_sales)+'</section></aside></div>';
  }
  function renderCallExecution(d){
    var meetings=d.meetings||[],actions=d.top_actions||[],funnel=d.funnel||[],opps=d.opportunities||[];
    function rows(xs,fn,empty){return xs.length?xs.map(fn).join(''):'<div class="ops-empty">'+empty+'</div>';}
    var actionRows=rows(actions,function(a){return '<div class="ops-row"><span class="ops-priority p'+Number(a.priority||2)+'">P'+Number(a.priority||2)+'</span><div class="ops-main"><b>'+esc(a.title)+'</b><small>'+esc(INTEL.displayName(a.talent_id))+' · '+esc(a.owner_ref||'owner da confermare')+' · DoD: '+esc(a.definition_of_done||'da confermare')+'</small></div><span class="ops-status approved">FTD '+Number(a.ftd_priority_score||0).toFixed(1)+'</span></div>';},'Nessuna azione estratta dalle call.');
    var meetRows=rows(meetings,function(m){return '<div class="ops-row"><span class="cc-badge '+(Number(m.ambiguous_items)>0?'attention':'ok')+'">'+esc(m.status)+'</span><div class="ops-main"><b>'+esc(INTEL.displayName(m.talent_id||'jj'))+' · '+esc(m.meeting_type)+'</b><small>'+Number(m.action_items||0)+' action item · '+Number(m.materialized_items||0)+' confermati · '+Number(m.ambiguous_items||0)+' ambigui</small></div><span class="ops-status">'+esc(opsDate(m.scheduled_start))+'</span></div>';},'Nessuna call processata.');
    var funnelRows=rows(funnel.slice(0,18),function(f){return '<div class="ops-row"><span class="ops-priority">'+esc(f.market||'all')+'</span><div class="ops-main"><b>'+esc(INTEL.displayName(f.talent_id))+' · '+esc(String(f.bottleneck||'').replace(/_/g,' '))+'</b><small>'+Number(f.joins||0)+' join → '+Number(f.deposits||0)+' depositi → '+Number(f.ftd||0)+' FTD</small></div><span class="ops-status">'+esc(String(f.metric_day||''))+'</span></div>';},'Dati funnel non ancora importati.');
    var oppRows=rows(opps,function(o){return '<div class="ops-row"><span class="ops-priority p'+Number(o.priority||2)+'">P'+Number(o.priority||2)+'</span><div class="ops-main"><b>'+esc(o.title)+'</b><small>'+esc(INTEL.displayName(o.talent_id||'jj'))+' · confidenza '+Math.round(Number(o.confidence||0)*100)+'%</small></div></div>';},'Nessuna opportunità aperta.');
    content.innerHTML='<div class="ops-head"><div><h2 class="ops-title">Call-to-Execution</h2><div class="muted">Dalle call alle cinque azioni con maggiore impatto FTD.</div></div></div><div class="ops-kpis"><div class="ops-kpi"><strong>'+meetings.length+'</strong><span>call processate</span></div><div class="ops-kpi"><strong>'+actions.length+'</strong><span>azioni prioritarie</span></div><div class="ops-kpi"><strong>'+opps.length+'</strong><span>opportunità</span></div><div class="ops-kpi"><strong>'+funnel.filter(function(x){return x.bottleneck&&x.bottleneck!=="healthy_or_insufficient";}).length+'</strong><span>colli di bottiglia</span></div></div><div class="ops-layout"><div><section class="ops-section"><div class="ops-section-head"><h3>Top azioni FTD</h3></div>'+actionRows+'</section><section class="ops-section"><div class="ops-section-head"><h3>Funnel Autopsy</h3></div>'+funnelRows+'</section></div><aside><section class="ops-section"><div class="ops-section-head"><h3>Call recenti</h3></div>'+meetRows+'</section><section class="ops-section"><div class="ops-section-head"><h3>Opportunity Detector</h3></div>'+oppRows+'</section></aside></div>';
  }

  // ---------------- GENERALE ----------------
  function renderGenerale(){
    var admin=auth&&INTEL.isAdmin(auth.id);
    content.innerHTML=studioHero(admin?'Newsroom':'News','Trova la storia giusta','Notizie, fonti e spunti editoriali per trasformare ciò che succede oggi in contenuti credibili.','Pool condiviso · verifica fonte obbligatoria')+
      '<div class="news-gateway">'+
        '<section class="studio-card wide"><div class="studio-card-head"><div><h2>News &amp; ricerca</h2><div class="studio-kicker">La notizia è la star; il trading resta il contesto</div></div><span class="studio-signal good">live desk</span></div><p class="studio-lead" style="max-width:70ch">Apri la classifica editoriale per scegliere la storia più forte: cronaca, attualità, macro, geopolitica, politica, studi, trend e mercati. Il motore SMM/copy trasforma la fonte in hook, scaletta e contenuto senza premiare cinque volte lo stesso tema.</p><a class="studio-action" href="'+NEWS_URL+'">Apri classifica e pool</a></section>'+ 
        '<aside class="studio-card"><div class="studio-card-head"><div><h2>Metodo JBGRL</h2><div class="studio-kicker">Dalla fonte alla registrazione</div></div></div><div class="studio-list"><div class="studio-item"><div><span class="studio-signal">1</span><b style="margin-top:8px">Capisci il fatto</b><small>Fonte, contesto e perché interessa al tuo pubblico.</small></div></div><div class="studio-item"><div><span class="studio-signal">2</span><b style="margin-top:8px">Scegli l’angolo</b><small>Indignazione, consapevolezza o riscatto senza forzare il collegamento al trading.</small></div></div><div class="studio-item"><div><span class="studio-signal">3</span><b style="margin-top:8px">Produci e misura</b><small>Hook, script, asset e risultati restano collegati nello stesso flusso.</small></div></div></div></aside>'+
      '</div>';
  }

  function render(){
    destroyCharts();
    if(view==='adminhome') loadAdminHome();
    else if(view==='news') renderGenerale();
    else if(view==='foryou') loadIntelligence();
    else if(view==='talentads') loadTalentAds();
    else if(view==='production') loadTalentProduction();
    else if(view==='library') loadTalentLibrary();
    else if(view==='results') loadTalentResults();
    else if(view==='agenda') loadTalentAgenda();
    else if(view==='ads') loadAds();
    else if(view==='metriche') loadMetriche();
    else if(view==='reels') loadReels();
    else if(view==='analisi') loadAnalisi();
    else if(view==='piano') loadPiano();
    else if(view==='operazioni') loadOperazioni();
    else if(view==='command') loadCommandCenter();
    else if(view==='marketing') loadMarketing();
    else if(view==='intel') loadIntelligence();
    else if(view==='calls') loadCallExecution();
    else renderGenerale();
  }

  function boot(){
    ensureSb();
    if(!auth && opsFixtureEnabled()){
      var q; try{ q=new URLSearchParams(location.search); }catch(e){ q=null; }
      var asId=INTEL.resolveTalent((q&&q.get('as'))||'claudia');
      auth={id:asId,color:COLORS[asId]||'#e6b64c'};
      view=(q&&q.get('view'))||(INTEL.isAdmin(asId)?'adminhome':'news');
    }
    if(!auth){ showLogin(); return; }
    hideLogin();
    setAccent(auth.id);
    var admin=INTEL.isAdmin(auth.id);
    document.body.classList.toggle('talent-mode',!admin);
    document.getElementById('whoami').style.display='flex';
    document.getElementById('tabs').style.display='flex';
    document.getElementById('whoami-txt').textContent=(NAMES[auth.id]||auth.id)+(admin?' \u00b7 admin':'');
    // Talent Studio has six focused destinations. Operational views remain admin-only.
    Array.prototype.forEach.call(document.querySelectorAll('.tab.talent-only'),function(x){ x.style.display=admin?'none':''; });
    Array.prototype.forEach.call(document.querySelectorAll('.tab.admin-only'),function(x){ x.style.display=admin?'':'none'; });
    var talentViews=['news','foryou','talentads','production','library','results','agenda'];
    var adminViews=['adminhome','generale','reels','ads','metriche','analisi','piano','operazioni','command','marketing','intel','calls'];
    var fixtureRequested=opsFixtureEnabled()&&new URLSearchParams(location.search).get('view');
    if(!fixtureRequested){
      if(admin&&adminViews.indexOf(view)<0) view='adminhome';
      if(!admin&&talentViews.indexOf(view)<0) view='news';
    }
    Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){var on=x.getAttribute('data-view')===view;x.classList.toggle('on',on);x.setAttribute('aria-selected',on?'true':'false');});
    render();
  }
  // aspetta il caricamento del client
  var tries=0;
  (function w(){ if(ensureSb()){ boot(); } else if(tries++<50){ setTimeout(w,120);} })();
})();
</script>
