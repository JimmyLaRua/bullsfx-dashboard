<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulls Content Hub</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#121722; --panel2:#0f141d; --line:#1e2634;
    --txt:#e8ecf4; --mut:#8b95ab; --gold:#e6b64c; --green:#3ecf8e; --red:#ff6b6b;
    --t-alberto:#3ecf8e; --t-marco:#5aa9ff; --t-jj:#e6b64c; --t-claudia:#b48cff; --t-samantha:#ff6b6b; --t-nabil:#22d3ee; --t-luca:#ff7a1a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:inherit}
  .wrap{max-width:1200px;margin:0 auto;padding:18px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .brand{font-weight:800;font-size:20px;letter-spacing:.3px}
  .brand span{color:var(--accent,var(--gold))}
  .whoami{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--accent,var(--gold))}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 18px}
  .tab{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--mut);cursor:pointer;font-weight:600;font-size:13px}
  .tab.on{background:var(--accent,var(--gold));color:#0b0e14;border-color:transparent}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .muted{color:var(--mut);font-size:13px}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px}
  .btn.primary{background:var(--accent,var(--gold));color:#0b0e14;border-color:transparent}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  /* Card verticale stile reel 9:16 */
  .card{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;min-height:420px;border-top:3px solid var(--accent,var(--gold))}
  .card .meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
  .card .angolo{color:var(--accent,var(--gold));font-weight:700}
  .card .hook{font-size:18px;font-weight:800;line-height:1.3;margin:2px 0 10px}
  .card .body{font-size:13.5px;color:#d3d9e6;flex:1;white-space:pre-wrap}
  .card .cta{margin-top:10px;font-weight:700;font-size:13.5px;color:var(--accent,var(--gold))}
  .card .fonte{margin-top:8px;font-size:11px;color:var(--mut)}
  .card .amb{margin-top:6px;font-size:11px;color:var(--mut);font-style:italic}
  .card .tick{position:absolute;top:12px;right:12px}
  .check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--mut);user-select:none}
  .check input{width:20px;height:20px;accent-color:var(--green);cursor:pointer}
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;background:#1a2130;color:var(--mut)}
  .badge.clean{color:var(--green)}
  .badge.orig{color:var(--gold)}
  /* Metriche */
  .mcard{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;border-left:3px solid var(--accent,var(--gold))}
  .mcard .mtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .mcard .mtitle{font-weight:800}
  .mcard .msub{color:var(--mut);font-size:12px}
  .block{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
  .block.locked{opacity:.55}
  .block h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
  .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .field label{display:block;font-size:11px;color:var(--mut);margin-bottom:4px}
  .field input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:7px}
  .idx{font-weight:800;color:var(--accent,var(--gold))}
  .pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;background:#1a2130;color:var(--mut)}
  .pill.ig{color:#ff6b6b}.pill.tt{color:#5aa9ff}
  /* Login */
  .overlay{position:fixed;inset:0;background:rgba(6,9,14,.92);display:flex;align-items:center;justify-content:center;z-index:50}
  .login{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:min(92vw,380px)}
  .login h2{margin:0 0 6px}
  .login .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .login input{width:100%;padding:12px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;font-size:16px;letter-spacing:2px;text-align:center}
  .login .err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
  /* Platform picker */
  .pick{position:fixed;inset:0;background:rgba(6,9,14,.9);display:none;align-items:center;justify-content:center;z-index:60}
  .pick .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(92vw,340px);text-align:center}
  .pick h3{margin:0 0 6px}.pick .psub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .pick .prow{display:flex;flex-direction:column;gap:8px}
  .empty{color:var(--mut);text-align:center;padding:40px;border:1px dashed var(--line);border-radius:14px}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:#0b0e14;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .note{font-size:12px;color:var(--mut);margin-top:6px}
  /* Analisi */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-left:3px solid var(--accent,var(--gold))}
  .stat .lbl{font-size:12px;color:var(--mut);margin-bottom:6px}
  .stat .val{font-size:24px;font-weight:800}
  .stat .sub{font-size:11px;color:var(--mut);margin-top:2px}
  .chartbox{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .chartbox h4{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
  .chartwrap{position:relative;width:100%;height:280px}
  .postrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .postrow:first-of-type{border-top:none}
  .postrow .cap{flex:1;font-size:13px}
  .postrow .num{font-weight:800;font-size:14px}
  .demo-banner{background:#2a2410;border:1px solid #574a1a;color:var(--gold);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}
  /* Operazioni */
  .ops-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;margin-bottom:16px}
  .ops-title{font-size:22px;line-height:1.2;margin:0 0 4px}
  .ops-sync{font:500 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);text-align:right}
  .ops-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px;background:var(--panel2)}
  .ops-kpi{padding:12px 14px;border-right:1px solid var(--line)}
  .ops-kpi:last-child{border-right:0}
  .ops-kpi strong{display:block;font:700 22px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--txt)}
  .ops-kpi span{font-size:11px;color:var(--mut)}
  .ops-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr);gap:16px;align-items:start}
  .ops-section{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
  .ops-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .ops-section-head h3{font-size:13px;margin:0}
  .ops-count{font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut)}
  .ops-row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;border-bottom:1px solid var(--line)}
  .ops-row:last-child{border-bottom:0}
  .ops-priority{font:700 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;color:var(--mut)}
  .ops-priority.p0,.ops-priority.blocked{color:var(--red)}
  .ops-priority.p1{color:var(--gold)}
  .ops-main b{display:block;font-size:13px;line-height:1.35;margin-bottom:3px}
  .ops-main small{display:block;color:var(--mut);font-size:11px;line-height:1.4}
  .ops-status{font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;color:var(--mut);white-space:nowrap}
  .ops-status.recording,.ops-status.approved{color:var(--green)}
  .ops-status.editing,.ops-status.review,.ops-status.proposed{color:var(--gold)}
  .ops-alert{padding:12px 14px;background:#271719;color:#ff9b9b;border-bottom:1px solid #4a2528;font-size:12px}
  .ops-empty{padding:18px 14px;color:var(--mut);font-size:12px}
  .ops-links{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px}
  .ops-links .btn{padding:8px 10px;font-size:12px;text-decoration:none}
  @media(max-width:760px){
    .ops-head{grid-template-columns:1fr}.ops-sync{text-align:left}
    .ops-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.ops-kpi:nth-child(2){border-right:0}.ops-kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}
    .ops-layout{grid-template-columns:1fr}.ops-row{grid-template-columns:64px minmax(0,1fr)}.ops-status{grid-column:2}
  }
  /* Command Center + Content Intelligence */
  .cc-badge{font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:3px 7px;border-radius:5px;text-transform:uppercase;white-space:nowrap}
  .cc-badge.urgent,.cc-badge.critical{background:rgba(255,107,107,.15);color:var(--red)}
  .cc-badge.attention,.cc-badge.high{background:rgba(230,182,76,.15);color:var(--gold)}
  .cc-badge.normal,.cc-badge.low{background:#1a2130;color:var(--mut)}
  .cc-badge.ok{background:rgba(62,207,142,.15);color:var(--green)}
  .cc-tname{font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);text-transform:uppercase}
  .cc-details{border-top:1px solid var(--line)}
  .cc-details>summary{cursor:pointer;padding:10px 14px;font-size:12px;color:var(--mut);list-style:none;display:flex;align-items:center;gap:8px}
  .cc-details>summary::-webkit-details-marker{display:none}
  .cc-details>summary::before{content:"\u25b8";color:var(--accent,var(--gold))}
  .cc-details[open]>summary::before{content:"\u25be"}
  .cc-replay{padding:2px 14px 12px 28px;font:400 11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut)}
  .cc-replay .step{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-top:1px dashed var(--line)}
  .cc-replay .step:first-child{border-top:none}
  .cc-replay .step .r-fail{color:var(--red)}
  .cc-table{width:100%;border-collapse:collapse;font-size:12px}
  .cc-table th,.cc-table td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  .cc-table th{color:var(--mut);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.4px}
  .cc-table td.num,.cc-table th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .cc-table tr:last-child td{border-bottom:none}
  .cc-tablewrap{overflow-x:auto}
  .rec{display:inline-block;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
  .rec.good{background:rgba(62,207,142,.15);color:var(--green)}
  .rec.warn{background:rgba(230,182,76,.15);color:var(--gold)}
  .rec.bad{background:rgba(255,107,107,.15);color:var(--red)}
  .rec.muted{background:#1a2130;color:var(--mut)}
  .intel-sel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .intel-sel .chip{padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--mut);cursor:pointer;font-size:12px;font-weight:600}
  .intel-sel .chip.on{background:var(--accent,var(--gold));color:#0b0e14;border-color:transparent}
  .filters{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:10px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
  .filters .flabel{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin-right:2px}
  .filters .fgroup{display:flex;gap:4px}
  .filters .fbtn{padding:5px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--mut);cursor:pointer;font-size:11px;font-weight:600}
  .filters .fbtn.on{background:var(--accent,var(--gold));color:#0b0e14;border-color:transparent}
  .cc-note{font-size:11px;color:var(--mut);padding:10px 14px}
  @media(max-width:760px){
    .cc-table thead{display:none}
    .cc-table,.cc-table tbody,.cc-table tr,.cc-table td{display:block;width:100%}
    .cc-table tr{border-bottom:1px solid var(--line);padding:6px 0}
    .cc-table td{border-bottom:none;padding:3px 12px;text-align:left!important}
    .cc-table td.num{text-align:left}
    .cc-table td[data-l]::before{content:attr(data-l) ": ";color:var(--mut);font-size:10px;text-transform:uppercase}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Bulls <span>Content Hub</span></div>
    <div class="whoami" id="whoami" style="display:none">
      <span class="dot"></span><span id="whoami-txt"></span>
      <button class="btn" id="logout" style="padding:6px 12px;font-size:12px">Esci</button>
    </div>
  </header>

  <div class="tabs" id="tabs" style="display:none">
    <div class="tab" data-view="generale">Generale (news)</div>
    <div class="tab" data-view="reels">Reels organici</div>
    <div class="tab on" data-view="ads">Ads</div>
    <div class="tab" data-view="metriche">Metriche</div>
    <div class="tab" data-view="analisi">Analisi</div>
    <div class="tab" data-view="operazioni">Operazioni</div>
    <div class="tab admin-only" data-view="command" style="display:none">Command Center</div>
    <div class="tab admin-only" data-view="marketing" style="display:none">Email &amp; Webinar</div>
    <div class="tab" data-view="intel">Content Intelligence</div>
    <div class="tab" data-view="calls">Call &amp; Priorità</div>
  </div>

  <div id="content"></div>
</div>

<!-- LOGIN -->
<div class="overlay" id="login">
  <div class="login">
    <h2>Accedi</h2>
    <div class="sub">Inserisci il tuo <b>codice personale</b>.</div>
    <input id="lg-code" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
    <div class="err" id="lg-err"></div>
    <button class="btn primary" id="lg-go" style="width:100%;margin-top:10px">Entra</button>
  </div>
</div>

<!-- PLATFORM PICKER -->
<div class="pick" id="pick">
  <div class="box">
    <h3>Dove l'hai pubblicato?</h3>
    <div class="psub">Scegli la piattaforma: tracceremo le metriche separate.</div>
    <div class="prow">
      <button class="btn" data-pf="ig">Instagram Reels</button>
      <button class="btn" data-pf="tiktok">TikTok</button>
      <button class="btn primary" data-pf="both">Entrambe</button>
      <button class="btn" data-pf="cancel" style="opacity:.7">Annulla</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
(function(){
  var SB_URL='https://iuvkbjmgxbkhrvuervrz.supabase.co';
  var SB_KEY='sb_publishable_ntOoKJdAdZs0CcR_BClaew_oRsq1uiC';
  var COLORS={alberto:'#3ecf8e',marco:'#5aa9ff',jj:'#e6b64c',claudia:'#b48cff',samantha:'#ff6b6b',nabil:'#22d3ee',luca:'#ff7a1a'};
  var NAMES={alberto:'Alberto',marco:'No Matrix',jj:'JJ',claudia:'Claudia',samantha:'Samantha',nabil:'Nabil',luca:'Luca Puleo'};
  var PLAT={ig:'IG Reels',tiktok:'TikTok'};
  var NEWS_URL='index.html';

  var sb=null;
  function ensureSb(){ if(!sb && window.supabase){ try{ sb=window.supabase.createClient(SB_URL,SB_KEY);}catch(e){sb=null;} } return sb; }

  var AUTH='bullshub_auth_v1';
  function load(k,d){ try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;} }
  function save(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
  function del(k){ try{localStorage.removeItem(k);}catch(e){} }

  var auth=load(AUTH,null);
  var view='ads';
  var reelsData=null;
  var TALENT_LIVE_READ_ONLY=true;
  var legacySnapshotCache=null;
  var legacySnapshotAt=0;

  function loadLegacySnapshot(force){
    if(!auth||!auth.opsToken||!ensureSb()) return Promise.reject(new Error('sessione operativa non disponibile'));
    if(!force&&legacySnapshotCache&&Date.now()-legacySnapshotAt<30000) return Promise.resolve(legacySnapshotCache);
    return ensureSb().rpc('ops_legacy_talent_snapshot',{p_session_token:auth.opsToken}).then(function(res){
      if(res.error||!res.data) throw (res.error||new Error('snapshot non disponibile'));
      if(res.data.talent_id!==auth.id) throw new Error('perimetro talent non valido');
      legacySnapshotCache=res.data; legacySnapshotAt=Date.now(); return legacySnapshotCache;
    });
  }

  var loginEl=document.getElementById('login');
  var lgCode=document.getElementById('lg-code');
  var lgErr=document.getElementById('lg-err');
  var content=document.getElementById('content');

  function setAccent(tid){ document.documentElement.style.setProperty('--accent', COLORS[tid]||'#e6b64c'); }

  function showLogin(){ loginEl.style.display='flex'; lgErr.textContent=''; lgCode.value=''; setTimeout(function(){lgCode.focus();},50); }
  function hideLogin(){ loginEl.style.display='none'; }

  function doLogin(){
    var code=(lgCode.value||'').trim();
    if(!code){ lgErr.textContent='Inserisci il tuo codice.'; return; }
    var s=ensureSb(); if(!s){ lgErr.textContent='Connessione non disponibile. Riprova.'; return; }
    lgErr.textContent='Verifica\u2026';
    var clientRef=localStorage.getItem('jbgrl_client_ref');
    if(!clientRef){ clientRef='web_'+Array.from(crypto.getRandomValues(new Uint8Array(18)),function(x){return x.toString(16).padStart(2,'0');}).join(''); localStorage.setItem('jbgrl_client_ref',clientRef); }
    s.rpc('ops_login_code_v2',{p_pin:code,p_client_ref:clientRef}).then(function(res){
      var row=(res.data&&res.data[0])||null;
      if(res.error||!row){ lgErr.textContent=res.error&&String(res.error.message).includes('locked')?'Troppi tentativi. Riprova più tardi.':'Codice errato. Riprova.'; return; }
      auth={id:row.talent_id,color:row.color,opsToken:row.session_token,opsExpiresAt:row.expires_at};
      save(AUTH,auth); hideLogin(); boot();
    }, function(){ lgErr.textContent='Errore di connessione. Riprova.'; });
  }
  document.getElementById('lg-go').onclick=doLogin;
  lgCode.onkeydown=function(e){ if(e.key==='Enter') doLogin(); };
  document.getElementById('logout').onclick=function(){
    var token=auth&&auth.opsToken;
    if(token&&ensureSb()){ ensureSb().rpc('ops_logout',{p_session_token:token}); }
    del(AUTH); auth=null; location.reload();
  };

  // ---------------- PLATFORM PICKER ----------------
  var pickEl=document.getElementById('pick');
  var pickCb=null;
  Array.prototype.forEach.call(pickEl.querySelectorAll('[data-pf]'),function(b){
    b.onclick=function(){
      var v=b.getAttribute('data-pf'); pickEl.style.display='none';
      var cb=pickCb; pickCb=null; if(!cb) return;
      if(v==='cancel') cb(null);
      else if(v==='both') cb(['ig','tiktok']);
      else cb([v]);
    };
  });
  function askPlatform(cb){ pickCb=cb; pickEl.style.display='flex'; }

  // tabs
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
    t.onclick=function(){
      Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){x.classList.remove('on');});

  // Pure, side-effect-free logic (identity resolution, admin gating, leaderboard, angle recommendation).
  // Exposed on window.__intel so the Node test suite can exercise the exact shipped code.
  var INTEL=(function(){
    var DISPLAY={alberto:'Alberto',marco:'No Matrix',claudia:'Claudia',samantha:'Samantha',nabil:'Nabil',luca:'Luca Puleo',jj:'JJ'};
    var ALIASES={'alberto':'alberto','claudia':'claudia','samantha':'samantha','nabil':'nabil','jj':'jj',
      'marco':'marco','no matrix':'marco','nomatrix':'marco','nomatrix system':'marco',
      'luca':'luca','luca puleo':'luca'};
    // Operational affiliates only. jj is the administrator and is intentionally excluded.
    var AFFILIATES=['alberto','marco','claudia','samantha','nabil','luca'];
    var MIN_PUBLICATIONS=3, MIN_VIEWS=20000;
    function norm(s){ return (s==null?'':String(s)).trim().toLowerCase(); }
    function resolveTalent(name){ var k=norm(name); if(ALIASES[k]) return ALIASES[k]; return (AFFILIATES.indexOf(k)>=0||k==='jj')?k:k; }
    function displayName(id){ return DISPLAY[resolveTalent(id)]||id; }
    function isAdmin(id){ return resolveTalent(id)==='jj'; }
    function isAffiliate(id){ return AFFILIATES.indexOf(resolveTalent(id))>=0; }
    function leaderboard(rows){
      return (rows||[]).map(function(r){ return {id:resolveTalent(r.talent_id!=null?r.talent_id:r.id),ftd:Number(r.ftd||0),views:Number(r.views||0)}; })
        .filter(function(r){ return r.id!=='jj' && AFFILIATES.indexOf(r.id)>=0; })
        .sort(function(a,b){ return (b.ftd-a.ftd) || (b.views-a.views); });
    }
    // Never a "winner" on asset volume alone: a push requires publications + views + engagement + FTD evidence.
    function angleRecommendation(a){
      a=a||{};
      var pubs=Number(a.publications||0), views=Number(a.views||0), ftd=Number(a.ftd||0), ei=Number(a.engagement_index||0);
      if(pubs<MIN_PUBLICATIONS || views<MIN_VIEWS){
        return {label:'dati insufficienti',code:'insufficient',tone:'muted',
          reason:pubs+' pubbl. \u00b7 '+views.toLocaleString('it-IT')+' view (soglia '+MIN_PUBLICATIONS+' pubbl. / '+MIN_VIEWS.toLocaleString('it-IT')+' view)'};
      }
      if(ei>=55 && ftd>0) return {label:'spingi',code:'push',tone:'good',reason:'EI '+ei+' \u00b7 '+ftd+' FTD su '+pubs+' pubbl.'};
      if(ei>=35) return {label:'varia',code:'vary',tone:'warn',reason:'EI '+ei+' \u00b7 segnale medio, testa nuove varianti'};
      return {label:'sospendi',code:'stop',tone:'bad',reason:'EI '+ei+' \u00b7 '+ftd+' FTD, sotto soglia'};
    }
    return {DISPLAY:DISPLAY,ALIASES:ALIASES,AFFILIATES:AFFILIATES,MIN_PUBLICATIONS:MIN_PUBLICATIONS,MIN_VIEWS:MIN_VIEWS,
      resolveTalent:resolveTalent,displayName:displayName,isAdmin:isAdmin,isAffiliate:isAffiliate,
      leaderboard:leaderboard,angleRecommendation:angleRecommendation};
  })();
  if(typeof window!=='undefined'){ window.__intel=INTEL; }

    var sh=(win==='7'?m.v7_shares:m.v24_shares)||0;
    var fo=(win==='7'?m.v7_follows:m.v24_follows)||0;
    var ct=(win==='7'?m.v7_cta:m.v24_cta)||0;
    return Math.round((sv + 2*sh + 3*fo + 4*ct)/v*1000*10)/10;

  // ---------------- COMMAND CENTER (admin) ----------------
  function ccSecs(s){
    s=Number(s); if(!isFinite(s)) return '\u2014';
    if(s<=0) return 'scaduto';
    if(s<3600) return Math.round(s/60)+'m';
    var h=Math.floor(s/3600), m=Math.round((s%3600)/60); return h+'h '+m+'m';
  }
  function ccEur(n){ return '\u20ac'+(Math.round((Number(n)||0)*100)/100).toLocaleString('it-IT'); }
  function ccName(id){ return '<span class="cc-tname">'+esc(INTEL.displayName(id))+'</span>'; }
  function loadCommandCenter(){
    destroyCharts();
    if(!INTEL.isAdmin(auth.id)){ content.innerHTML='<div class="empty">Sezione riservata all\u2019amministratore.</div>'; return; }
    content.innerHTML=spinner('Preparo il Command Center\u2026');
    if(opsFixtureEnabled()){
      fetch('fixtures/command-center.sample.json').then(function(r){if(!r.ok)throw 0;return r.json();})
        .then(function(j){ renderCommandCenter(j.command_center||j); })
        .catch(function(){ renderCCError('Fixture command center non disponibile.',loadCommandCenter); });
      return;
    }
    if(!auth.opsToken){ content.innerHTML='<div class="empty"><b>Sessione operativa da attivare</b><br>Esci e accedi di nuovo con il tuo codice.</div>'; return; }
    ensureSb().rpc('ops_dashboard_snapshot',{p_session_token:auth.opsToken}).then(function(res){
      if(res.error||!res.data){ renderCCError('Non riesco a caricare il Command Center. Riprova tra poco.',loadCommandCenter); return; }
      var cc=res.data.command_center;
      if(!cc){ renderCCPending(); return; }
      ensureSb().rpc('ops_operational_health_snapshot',{p_session_token:auth.opsToken}).then(function(healthRes){
        cc.operational_health=healthRes&&!healthRes.error?healthRes.data:null;
        renderCommandCenter(cc);
      },function(){ renderCommandCenter(cc); });
    },function(){ renderCCError('Connessione operativa non disponibile.',loadCommandCenter); });

  // ---------------- CONTENT INTELLIGENCE ----------------
  var INTEL_FILTERS_KEY='bullshub_intel_filters_v1', INTEL_SEL_KEY='bullshub_intel_sel_v1';
  var intelFilters=load(INTEL_FILTERS_KEY,{ctype:'all',platform:'all'});
  var _intelList=null;
  function attachOrganicTracking(list,payload){
    payload=payload||{};
    var accounts=payload.accounts||[], performance=payload.performance||[], recommendations=payload.recommendations||[], quarantine=payload.quarantine||[];
    return (list||[]).map(function(aff){
      var id=INTEL.resolveTalent(aff.talent_id);
      aff.organic_accounts=accounts.filter(function(x){return INTEL.resolveTalent(x.talent_id)===id;});
      aff.organic_performance=performance.filter(function(x){return INTEL.resolveTalent(x.talent_id)===id;});
      aff.organic_recommendations=recommendations.filter(function(x){return INTEL.resolveTalent(x.talent_id)===id;});
      aff.organic_quarantine=quarantine.filter(function(x){return INTEL.resolveTalent(x.talent_id)===id;});
      return aff;
    });
  }
  function loadIntelligence(){
    destroyCharts();
    content.innerHTML=spinner('Carico la Content Intelligence\u2026');
    function proceed(list){
      if(!INTEL.isAdmin(auth.id)){
        var mine=(list||[]).filter(function(x){return INTEL.resolveTalent(x.talent_id)===INTEL.resolveTalent(auth.id);});
        _intelList=mine;
      } else { _intelList=list||[]; }
      renderIntelligence();
    }
    if(opsFixtureEnabled()){
      fetch('fixtures/content-intelligence.sample.json').then(function(r){if(!r.ok)throw 0;return r.json();})
        .then(function(j){ proceed((j.content_intelligence&&j.content_intelligence.affiliates)||[]); })
        .catch(function(){ renderCCError('Fixture intelligence non disponibile.',loadIntelligence); });
      return;
    }
    if(!auth.opsToken){ content.innerHTML='<div class="empty"><b>Sessione operativa da attivare</b><br>Esci e accedi di nuovo con il tuo codice.</div>'; return; }
    ensureSb().rpc('ops_dashboard_snapshot',{p_session_token:auth.opsToken}).then(function(res){
      if(res.error||!res.data){ renderCCError('Non riesco a caricare la Content Intelligence.',loadIntelligence); return; }
      var ci=res.data.content_intelligence;
      if(ci&&ci.affiliates){
        ensureSb().rpc('ops_organic_tracking_snapshot',{p_session_token:auth.opsToken}).then(function(org){
          proceed(org.error?ci.affiliates:attachOrganicTracking(ci.affiliates,org.data));
        },function(){proceed(ci.affiliates);});
        return;
      }
      // Graceful fallback: derive a minimal single-affiliate view from the talent snapshot itself.
      proceed([affiliateFromSnapshot(res.data)]);
    },function(){ renderCCError('Connessione operativa non disponibile.',loadIntelligence); });
  }
  function affiliateFromSnapshot(data){
    var id=INTEL.resolveTalent(data.talent_id);
    var content_items=data.content||[], hooks=data.hooks||[], assets=data.assets||[];
    var mixMap={};
    content_items.forEach(function(c){
      var key=(c.content_type||'unknown')+'|'+(c.angle||'unclassified');
      if(!mixMap[key]) mixMap[key]={angle:c.angle||'unclassified',content_type:c.content_type||'unknown',asset_count:0,hook_count:0,mapped_count:0,publications:0,views:0,ftd:0,engagement_index:0};
      mixMap[key].asset_count++;
    });
    var unmapped=assets.filter(function(a){return !a.content_code;}).map(function(a){return {file_name:a.file_name,url:a.url,modified_at:a.created_at};});
    return {
      talent_id:id, display_name:INTEL.displayName(id),
      inventory:{total_assets:assets.length,ads:content_items.filter(function(c){return c.content_type==='ad';}).length,
        organico:content_items.filter(function(c){return c.content_type==='organic';}).length,hook_count:hooks.length,unmapped_count:unmapped.length},
      angle_mix:Object.keys(mixMap).map(function(k){return mixMap[k];}),
      hooks:hooks, unmapped_assets:unmapped,
      in_production:content_items.map(function(c){return {content_code:c.content_code,title:c.title,lifecycle_status:c.lifecycle_status,angle:c.angle,format:c.format};}),
      published:[]
    };
  }
  function renderIntelligence(){
    var list=_intelList||[];
    if(!list.length){ content.innerHTML='<div class="empty">Nessun dato di content intelligence disponibile.</div>'; return; }
    var admin=INTEL.isAdmin(auth.id);
    var sel=admin?(load(INTEL_SEL_KEY,null)):INTEL.resolveTalent(auth.id);
    var aff=list.filter(function(x){return INTEL.resolveTalent(x.talent_id)===INTEL.resolveTalent(sel);})[0]||list[0];
    var selBar='';
    if(admin){
      selBar='<div class="intel-sel">'+list.map(function(x){
        var on=INTEL.resolveTalent(x.talent_id)===INTEL.resolveTalent(aff.talent_id);
        return '<span class="chip'+(on?' on':'')+'" data-aff="'+esc(INTEL.resolveTalent(x.talent_id))+'">'+esc(x.display_name||INTEL.displayName(x.talent_id))+'</span>';
      }).join('')+'</div>';
    }
    content.innerHTML=selBar+affiliateIntelHtml(aff);
    if(admin){
      Array.prototype.forEach.call(content.querySelectorAll('.chip[data-aff]'),function(c){
        c.onclick=function(){ save(INTEL_SEL_KEY,c.getAttribute('data-aff')); renderIntelligence(); };
      });
    }
    Array.prototype.forEach.call(content.querySelectorAll('.fbtn[data-fk]'),function(b){
      b.onclick=function(){ intelFilters[b.getAttribute('data-fk')]=b.getAttribute('data-fv'); save(INTEL_FILTERS_KEY,intelFilters); renderIntelligence(); };
    });
  }
  function affiliateIntelHtml(aff){
    var inv=aff.inventory||{};
    var drive=opsSafeDriveUrl(aff.drive_url);
    var driveLink=drive?'<a class="btn" target="_blank" rel="noopener noreferrer" href="'+esc(drive)+'" style="padding:6px 10px;font-size:12px">Cartella Drive (sola lettura)</a>':'';
    var ctype=intelFilters.ctype||'all', plat=intelFilters.platform||'all';
    function typeMatch(t){ if(ctype==='all')return true; if(ctype==='ads')return t==='ad'; if(ctype==='organico')return t==='organic'; return true; }
    // Angle Mix
    var mix=(aff.angle_mix||[]).filter(function(m){return typeMatch(m.content_type);});
    var mixRows=mix.length?mix.map(function(m){
      var rec=INTEL.angleRecommendation(m);
      return '<tr><td data-l="Angolo"><b>'+esc(m.angle)+'</b></td>'+
        '<td data-l="Tipo">'+(m.content_type==='ad'?'Ads':(m.content_type==='organic'?'Organico':esc(m.content_type)))+'</td>'+
        '<td class="num" data-l="Asset">'+Number(m.asset_count||0)+'</td>'+
        '<td class="num" data-l="Hook">'+Number(m.hook_count||0)+'</td>'+
        '<td class="num" data-l="Pubbl.">'+Number(m.publications||0)+'</td>'+
        '<td class="num" data-l="View">'+Number(m.views||0).toLocaleString('it-IT')+'</td>'+
        '<td class="num" data-l="FTD">'+Number(m.ftd||0)+'</td>'+
        '<td class="num" data-l="EI">'+Number(m.engagement_index||0)+'</td>'+
        '<td data-l="Indicazione"><span class="rec '+rec.tone+'" title="'+esc(rec.reason)+'">'+esc(rec.label)+'</span></td></tr>';
    }).join(''):'<tr><td colspan="9" style="color:var(--mut)">Nessun angolo per questo filtro.</td></tr>';
    var mixTable='<div class="cc-tablewrap"><table class="cc-table"><thead><tr><th>Angolo</th><th>Tipo</th><th class="num">Asset</th><th class="num">Hook</th><th class="num">Pubbl.</th><th class="num">View</th><th class="num">FTD</th><th class="num">EI</th><th>Indicazione</th></tr></thead><tbody>'+mixRows+'</tbody></table></div>';
    // Hooks
    var hooks=(aff.hooks||[]).filter(function(h){return plat==='all'||h.platform===plat;});
    var hookRows=hooks.length?hooks.map(function(h){
      return '<div class="ops-row"><span class="ops-priority">'+esc(h.platform||'multi')+'</span>'+
        '<div class="ops-main"><b>'+esc(h.hook_text)+'</b><small>'+Number(h.publications||0)+' pubbl. \u00b7 '+Number(h.views||0).toLocaleString('it-IT')+' view \u00b7 '+Number(h.ftd||0)+' FTD</small></div>'+
        '<span class="ops-status approved">EI '+Number(h.engagement_index||0)+'</span></div>';
    }).join(''):'<div class="ops-empty">Nessun hook con evidenza sufficiente per questo filtro.</div>';
    // Unmapped assets (senza content_code)
    var un=(aff.unmapped_assets||[]);
    var unRows=un.length?un.map(function(a){
      var url=opsSafeDriveUrl(a.url); var name=url?'<a target="_blank" rel="noopener noreferrer" href="'+esc(url)+'">'+esc(a.file_name)+'</a>':esc(a.file_name);
      return '<div class="ops-row"><span class="ops-priority blocked">no code</span><div class="ops-main"><b>'+name+'</b><small>da mappare \u00b7 '+esc(opsDate(a.modified_at))+'</small></div></div>';
    }).join(''):'<div class="ops-empty">Tutti gli asset hanno un content_code.</div>';
    // In production
    var prod=(aff.in_production||[]).filter(function(c){return typeMatch(c.content_type||(String(c.content_code||'').indexOf('-ADS-')>=0?'ad':'organic'));});
    var prodRows=(aff.in_production||[]).length?(aff.in_production||[]).map(function(c){
      return '<div class="ops-row"><span class="ops-priority">'+esc((c.format||'file').slice(0,10))+'</span>'+
        '<div class="ops-main"><b>'+esc(c.title)+'</b><small>'+esc(c.content_code||'codice in assegnazione')+(c.angle?' \u00b7 '+esc(c.angle):'')+'</small></div>'+
        '<span class="ops-status '+esc(c.lifecycle_status)+'">'+opsStatus(c.lifecycle_status)+'</span></div>';
    }).join(''):'<div class="ops-empty">Nessun contenuto in produzione.</div>';
    // Published + metrics
    var pub=(aff.published||[]).filter(function(p){return plat==='all'||p.platform===plat;});
    var pubRows=pub.length?pub.map(function(p){
      return '<div class="ops-row"><span class="ops-priority">'+esc(p.platform||'')+'</span>'+
        '<div class="ops-main"><b>'+esc(p.title)+'</b><small>'+esc(p.content_code||'')+' \u00b7 '+esc(opsDate(p.published_at))+'</small></div>'+
        '<span class="ops-status">'+Number(p.views||0).toLocaleString('it-IT')+' view \u00b7 '+Number(p.engagement||0)+'% \u00b7 '+Number(p.ftd||0)+' FTD</span></div>';
    }).join(''):'<div class="ops-empty">Nessuna pubblicazione registrata.</div>';

    // Official read-only organic sources + deterministic recommendations.
    var organicAccounts=aff.organic_accounts||[], organicPerf=(aff.organic_performance||[]).filter(function(p){return plat==='all'||p.platform===plat;}), organicRecs=(aff.organic_recommendations||[]).filter(function(r){return plat==='all'||r.platform===plat;}), organicQuarantine=aff.organic_quarantine||[];
    var organicAccountRows=organicAccounts.length?organicAccounts.map(function(a){
      var fresh=a.status==='active'&&a.last_seen_at;var tone=fresh?'ok':(a.status==='active'?'normal':'critical');
      return '<div class="ops-row"><span class="cc-badge '+tone+'">'+esc(a.status||'pending')+'</span><div class="ops-main"><b>'+esc(a.platform)+'</b><small>OAuth ufficiale · '+esc(a.access_mode||'read_only')+' · scope '+esc((a.granted_scopes||[]).join(', '))+'</small></div><span class="ops-status">'+esc(opsDate(a.last_seen_at))+'</span></div>';
    }).join(''):'<div class="ops-empty">Account organici non ancora autorizzati.</div>';
    var organicPerfRows=organicPerf.length?organicPerf.slice(0,25).map(function(p){
      return '<tr><td data-l="Piattaforma">'+esc(p.platform)+'</td><td data-l="Contenuto"><b>'+esc(p.title||p.content_code)+'</b><br><small>'+esc(p.content_code||'')+'</small></td><td class="num" data-l="View">'+Number(p.views||0).toLocaleString('it-IT')+'</td><td class="num" data-l="EI">'+Number(p.engagement_index||0)+'</td><td class="num" data-l="Click">'+Number(p.tracked_clicks||0)+'</td><td class="num" data-l="Lead">'+Number(p.leads||0)+'</td><td class="num" data-l="FTD">'+Number(p.ftd||0)+'</td></tr>';
    }).join(''):'<tr><td colspan="7" style="color:var(--mut)">Nessuna metrica organica ufficiale ancora acquisita.</td></tr>';
    var organicPerfTable='<div class="cc-tablewrap"><table class="cc-table"><thead><tr><th>Piattaforma</th><th>Contenuto</th><th class="num">View</th><th class="num">EI</th><th class="num">Click</th><th class="num">Lead</th><th class="num">FTD</th></tr></thead><tbody>'+organicPerfRows+'</tbody></table></div>';
    var organicRecRows=organicRecs.length?organicRecs.map(function(r){
      var label={create_variations:'Spingi e crea varianti',test_new_hook_or_format:'Varia hook o formato',pause_and_review:'Ferma e rivedi',collect_more_data:'Raccogli più dati'}[r.recommendation]||r.recommendation;
      var tone=r.recommendation==='create_variations'?'ok':(r.recommendation==='pause_and_review'?'critical':'normal');
      return '<div class="ops-row"><span class="cc-badge '+tone+'">'+esc(r.platform)+'</span><div class="ops-main"><b>'+esc(r.angle)+'</b><small>'+Number(r.publications||0)+' pubbl. · '+Number(r.views||0).toLocaleString('it-IT')+' view · '+Number(r.ftd||0)+' FTD</small></div><span class="ops-status">'+esc(label)+'</span></div>';
    }).join(''):'<div class="ops-empty">Direttive sospese finché il campione non è sufficiente.</div>';

    function fbtns(fk,opts){ return '<div class="fgroup">'+opts.map(function(o){var on=(intelFilters[fk]||'all')===o[0];return '<button class="fbtn'+(on?' on':'')+'" data-fk="'+fk+'" data-fv="'+o[0]+'">'+esc(o[1])+'</button>';}).join('')+'</div>'; }
    var filterBar='<div class="filters"><span class="flabel">Tipo</span>'+fbtns('ctype',[['all','Tutti'],['ads','Ads'],['organico','Organico']])+
      '<span class="flabel">Piattaforma</span>'+fbtns('platform',[['all','Tutte'],['ig','IG'],['tiktok','TikTok']])+'</div>';

    return '<div class="ops-head"><div><h2 class="ops-title">Content Intelligence \u00b7 '+esc(aff.display_name||INTEL.displayName(aff.talent_id))+'</h2><div class="muted">Inventario, angoli, hook e performance del perimetro.</div></div><div class="ops-sync">'+driveLink+'</div></div>'+
      '<div class="ops-kpis"><div class="ops-kpi"><strong>'+Number(inv.total_assets||0)+'</strong><span>asset totali</span></div>'+
      '<div class="ops-kpi"><strong>'+Number(inv.ads||0)+'</strong><span>ads</span></div>'+
      '<div class="ops-kpi"><strong>'+Number(inv.organico||0)+'</strong><span>organico</span></div>'+
      '<div class="ops-kpi"><strong'+(Number(inv.unmapped_count)>0?' style="color:var(--gold)"':'')+'>'+Number(inv.unmapped_count||0)+'</strong><span>senza content_code</span></div></div>'+
      filterBar+
      '<div class="ops-layout"><div>'+
        '<section class="ops-section"><div class="ops-section-head"><h3>Angle Mix &amp; copertura</h3><span class="ops-count">'+mix.length+'</span></div><div style="padding:6px 4px">'+mixTable+'</div><div class="cc-note">L\u2019indicazione usa pubblicazioni, view, engagement e FTD \u2014 mai il solo numero di asset.</div></section>'+
        '<section class="ops-section"><div class="ops-section-head"><h3>Hook Intelligence</h3><span class="ops-count">'+hooks.length+'</span></div>'+hookRows+'</section>'+
        '<section class="ops-section"><div class="ops-section-head"><h3>Contenuti pubblicati &amp; metriche</h3><span class="ops-count">'+pub.length+'</span></div>'+pubRows+'</section>'+
        '<section class="ops-section"><div class="ops-section-head"><h3>Organico ufficiale · sola lettura</h3><span class="ops-count">'+organicPerf.length+'</span></div>'+organicAccountRows+'<div style="padding:6px 4px">'+organicPerfTable+'</div><div class="cc-note">Token fuori dalla dashboard. Post non mappati: quarantena, mai attribuzione automatica.</div></section>'+
      '</div><aside>'+
        '<section class="ops-section"><div class="ops-section-head"><h3>Direttive organico</h3><span class="ops-count">'+organicRecs.length+'</span></div>'+organicRecRows+'</section>'+
        '<section class="ops-section"><div class="ops-section-head"><h3>Post da mappare</h3><span class="ops-count">'+organicQuarantine.length+'</span></div>'+(organicQuarantine.length?organicQuarantine.map(function(q){return '<div class="ops-row"><span class="ops-priority blocked">'+esc(q.platform)+'</span><div class="ops-main"><b>'+esc(q.entity_ref||'post')+'</b><small>'+esc(q.rule_code)+' · '+esc(opsDate(q.created_at))+'</small></div></div>';}).join(''):'<div class="ops-empty">Nessun post organico in quarantena.</div>')+'</section>'+
        '<section class="ops-section"><div class="ops-section-head"><h3>Asset senza content_code</h3><span class="ops-count">'+un.length+'</span></div>'+unRows+'</section>'+
        '<section class="ops-section"><div class="ops-section-head"><h3>In produzione</h3><span class="ops-count">'+(aff.in_production||[]).length+'</span></div>'+prodRows+'</section>'+
      '</aside></div>';
  }

  // ---------------- GENERALE ----------------
  function loadCallExecution(){
    destroyCharts();content.innerHTML=spinner('Carico call, priorità e funnel…');
    if(opsFixtureEnabled()){renderCallExecution({meetings:[],top_actions:[],funnel:[],opportunities:[]});return;}
    if(!auth.opsToken){content.innerHTML='<div class="empty">Sessione operativa da attivare.</div>';return;}
    ensureSb().rpc('ops_call_execution_snapshot',{p_session_token:auth.opsToken}).then(function(res){
      if(res.error||!res.data){renderCCError('Call Engine non disponibile.',loadCallExecution);return;}renderCallExecution(res.data);
    });
  }

  function loadMarketing(){
    destroyCharts();content.innerHTML=spinner('Carico email e webinar…');
    if(!auth||auth.id!=='jj'||!auth.opsToken||!ensureSb()){content.innerHTML='<div class="ops-empty">Area riservata agli admin.</div>';return;}
    ensureSb().rpc('ops_email_webinar_dashboard',{p_session_token:auth.opsToken}).then(function(res){
      if(res.error){content.innerHTML='<div class="ops-empty">Modulo non ancora collegato.</div>';return;}
      var s=res.data||{}, campaigns=s.campaigns||[], webinars=s.webinars||[], contacts=s.contacts||{};
      var campaignRows=rows(campaigns,function(x){return '<div class="ops-row"><span class="cc-badge '+(x.status==='sent'?'ok':'normal')+'">'+esc(x.status)+'</span><div class="ops-main"><b>'+esc(x.name)+'</b><small>'+esc(x.campaign_type)+' · '+Number(x.unique_clickers||0)+' click · '+Number(x.replies||0)+' risposte</small></div><span class="ops-status approved">'+Number(x.conversions||0)+' conv.</span></div>';},'Nessuna campagna misurata.');
      var webinarRows=rows(webinars,function(x){return '<div class="ops-row"><span class="cc-badge normal">WEBINAR</span><div class="ops-main"><b>'+esc(x.webinar_id)+' · '+esc(INTEL.displayName(x.talent_id))+'</b><small>'+Number(x.registered||0)+' registrati · '+Number(x.attended||0)+' presenti · '+Number(x.no_show||0)+' assenti</small></div><span class="ops-status approved">'+Number(x.conversions||0)+' conv.</span></div>';},'Nessun webinar misurato.');
      content.innerHTML='<div class="ops-head"><div><h2 class="ops-title">Email &amp; Webinar</h2><div class="muted">ActiveCampaign e WebinarJam · dati aggregati solo admin.</div></div></div><div class="ops-kpis"><div class="ops-kpi"><strong>'+Number(contacts.subscribed||0)+'</strong><span>iscritti</span></div><div class="ops-kpi"><strong>'+Number(contacts.suppressed||0)+'</strong><span>soppressi</span></div><div class="ops-kpi"><strong>'+campaigns.length+'</strong><span>campagne</span></div><div class="ops-kpi"><strong>'+webinars.length+'</strong><span>webinar</span></div></div><div class="ops-layout"><section class="ops-section"><div class="ops-section-head"><h3>Campagne</h3></div>'+campaignRows+'</section><aside><section class="ops-section"><div class="ops-section-head"><h3>Webinar</h3></div>'+webinarRows+'</section></aside></div>';
    });
  }
  function renderCallExecution(d){
    var meetings=d.meetings||[],actions=d.top_actions||[],funnel=d.funnel||[],opps=d.opportunities||[];
    function rows(xs,fn,empty){return xs.length?xs.map(fn).join(''):'<div class="ops-empty">'+empty+'</div>';}
    var actionRows=rows(actions,function(a){return '<div class="ops-row"><span class="ops-priority p'+Number(a.priority||2)+'">P'+Number(a.priority||2)+'</span><div class="ops-main"><b>'+esc(a.title)+'</b><small>'+esc(INTEL.displayName(a.talent_id))+' · '+esc(a.owner_ref||'owner da confermare')+' · DoD: '+esc(a.definition_of_done||'da confermare')+'</small></div><span class="ops-status approved">FTD '+Number(a.ftd_priority_score||0).toFixed(1)+'</span></div>';},'Nessuna azione estratta dalle call.');
    var meetRows=rows(meetings,function(m){return '<div class="ops-row"><span class="cc-badge '+(Number(m.ambiguous_items)>0?'attention':'ok')+'">'+esc(m.status)+'</span><div class="ops-main"><b>'+esc(INTEL.displayName(m.talent_id||'jj'))+' · '+esc(m.meeting_type)+'</b><small>'+Number(m.action_items||0)+' action item · '+Number(m.materialized_items||0)+' confermati · '+Number(m.ambiguous_items||0)+' ambigui</small></div><span class="ops-status">'+esc(opsDate(m.scheduled_start))+'</span></div>';},'Nessuna call processata.');
    var funnelRows=rows(funnel.slice(0,18),function(f){return '<div class="ops-row"><span class="ops-priority">'+esc(f.market||'all')+'</span><div class="ops-main"><b>'+esc(INTEL.displayName(f.talent_id))+' · '+esc(String(f.bottleneck||'').replace(/_/g,' '))+'</b><small>'+Number(f.joins||0)+' join → '+Number(f.deposits||0)+' depositi → '+Number(f.ftd||0)+' FTD</small></div><span class="ops-status">'+esc(String(f.metric_day||''))+'</span></div>';},'Dati funnel non ancora importati.');
    var oppRows=rows(opps,function(o){return '<div class="ops-row"><span class="ops-priority p'+Number(o.priority||2)+'">P'+Number(o.priority||2)+'</span><div class="ops-main"><b>'+esc(o.title)+'</b><small>'+esc(INTEL.displayName(o.talent_id||'jj'))+' · confidenza '+Math.round(Number(o.confidence||0)*100)+'%</small></div></div>';},'Nessuna opportunità aperta.');
    content.innerHTML='<div class="ops-head"><div><h2 class="ops-title">Call-to-Execution</h2><div class="muted">Dalle call alle cinque azioni con maggiore impatto FTD.</div></div></div><div class="ops-kpis"><div class="ops-kpi"><strong>'+meetings.length+'</strong><span>call processate</span></div><div class="ops-kpi"><strong>'+actions.length+'</strong><span>azioni prioritarie</span></div><div class="ops-kpi"><strong>'+opps.length+'</strong><span>opportunità</span></div><div class="ops-kpi"><strong>'+funnel.filter(function(x){return x.bottleneck&&x.bottleneck!=="healthy_or_insufficient";}).length+'</strong><span>colli di bottiglia</span></div></div><div class="ops-layout"><div><section class="ops-section"><div class="ops-section-head"><h3>Top azioni FTD</h3></div>'+actionRows+'</section><section class="ops-section"><div class="ops-section-head"><h3>Funnel Autopsy</h3></div>'+funnelRows+'</section></div><aside><section class="ops-section"><div class="ops-section-head"><h3>Call recenti</h3></div>'+meetRows+'</section><section class="ops-section"><div class="ops-section-head"><h3>Opportunity Detector</h3></div>'+oppRows+'</section></aside></div>';
  }

  // ---------------- GENERALE ----------------
  function renderGenerale(){
    content.innerHTML='<div class="empty">La sezione <b>Generale</b> è il pool notizie condiviso.<br><br>'+
      '<a class="btn primary" href="'+NEWS_URL+'">Apri il pool notizie</a></div>';
  }

  function render(){
    destroyCharts();
    if(view==='ads') loadAds();
    else if(view==='metriche') loadMetriche();
    else if(view==='reels') loadReels();
    else if(view==='analisi') loadAnalisi();
    else if(view==='operazioni') loadOperazioni();
    else if(view==='command') loadCommandCenter();
    else if(view==='marketing') loadMarketing();
    else if(view==='intel') loadIntelligence();
    else if(view==='calls') loadCallExecution();
    else renderGenerale();
  }

  function boot(){
    ensureSb();
    if(!auth && opsFixtureEnabled()){
      var q; try{ q=new URLSearchParams(location.search); }catch(e){ q=null; }
      var asId=INTEL.resolveTalent((q&&q.get('as'))||'claudia');
      auth={id:asId,color:COLORS[asId]||'#e6b64c'};
      view=(q&&q.get('view'))||(INTEL.isAdmin(asId)?'command':'operazioni');
    }
    if(!auth){ showLogin(); return; }
    hideLogin();
    setAccent(auth.id);
    var admin=INTEL.isAdmin(auth.id);
    document.getElementById('whoami').style.display='flex';
    document.getElementById('tabs').style.display='flex';
    document.getElementById('whoami-txt').textContent=(NAMES[auth.id]||auth.id)+(admin?' \u00b7 admin':'');
    // Admin-only tabs (Command Center) visible only to the administrator (jj).
    Array.prototype.forEach.call(document.querySelectorAll('.tab.admin-only'),function(x){ x.style.display=admin?'':'none'; });
    if(!admin && (view==='command'||view==='marketing')){ view='intel'; }
    Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){x.classList.toggle('on',x.getAttribute('data-view')===view);});
    render();
  }
  // aspetta il caricamento del client
  var tries=0;
  (function w(){ if(ensureSb()){ boot(); } else if(tries++<50){ setTimeout(w,120);} })();
})();
</script>
